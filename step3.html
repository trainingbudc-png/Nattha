<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 3 | ก่อนสอบ</title>
	<link rel="icon" href="https://github.com/trainingbudc-png/Nattha/blob/main/%E0%B8%A3%E0%B8%B9%E0%B8%9B.png?raw=true" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme-user.css">
    <style>
        .btn-confirm { background-color: #000000 !important; color: #ffffff !important; border-radius: 12px; padding: 15px; font-weight: bold; width: 100%; font-size: 1.1rem; transition: 0.3s; border: none; margin-top: 20px; }
        .btn-confirm:hover { background-color: #1a1a1a !important; color: #ffffff !important; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .form-check-input:checked { background-color: #6c757d !important; border-color: #6c757d !important; }
		body { background: #f8f9fa; font-family: 'Kanit', sans-serif; padding: 20px; }
        .confirm-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); max-width: 900px; margin: auto; border: 1px solid #e9ecef; }
        .info-box { background-color: #f8f9fa; border: 1px solid #dee2e6; border-radius: 12px; padding: 15px 10px; margin-bottom: 25px; display: flex; justify-content: space-around; align-items: stretch; }
        .info-label { font-size: 0.85rem; color: #6c757d; font-weight: 600; text-transform: uppercase; margin-bottom: 4px; }
        .info-value { font-size: 1.05rem; font-weight: bold; color: #212529; word-break: break-word;}
        .divider { width: 1px; background-color: #dee2e6; }
        .radio-group label { border-radius: 8px; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .hint-box { border-radius: 8px; font-size: 0.95rem; display: none; background-color: #f8f9fa; border-color: #dee2e6; color: #495057; }
        .ipad-card { transition: all 0.3s ease; border-color: #dee2e6; }
        .ipad-card.active-card { border-color: #212529 !important; box-shadow: 0 4px 15px rgba(0,0,0,0.08) !important; transform: translateY(-2px); }
        .select-ipad { width: 26px !important; height: 26px !important; cursor: pointer; accent-color: #212529; transition: transform 0.2s; }
        .check-item { width: 22px !important; height: 22px !important; cursor: pointer; accent-color: #212529; }
        .btn-ticked-all { background-color: #212529 !important; color: white !important; }
        
        /* ⚡ แก้ไขปัญหาเบี้ยวบนมือถือ: บังคับให้กล่อง w-50 กางเต็ม 100% เพื่อให้จัดกึ่งกลางได้ถูกต้อง */
        @media screen and (max-width: 768px) { 
            .confirm-card { padding: 20px; } 
            .info-box { flex-direction: column; gap: 15px; } 
            .info-box .w-50 { width: 100% !important; }
            .divider { width: 100%; height: 1px; } 
        }
    </style>
</head>
<body>

<div class="confirm-card">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold text-dark mb-0">📝 Step 3 | ก่อนสอบ</h4>
        <a href="step3-list.html" class="btn btn-outline-dark px-3 fw-bold rounded-pill btn-sm border-2">🔙 กลับ</a>
    </div>
    
    <div class="info-box">
        <div class="text-center w-50">
            <div class="info-label">👤 ผู้ขอเบิกยืม</div>
            <div id="displayUserName" class="info-value">กำลังโหลด...</div>
            <div id="proxyAlert" class="mt-2" style="display: none;"><span class="badge bg-warning text-dark border border-warning shadow-sm" style="font-size: 0.8rem; padding: 5px 10px;">🤝 ตรวจสอบแทนโดย: <span id="proxyNameDisplay" class="fw-bold"></span></span></div>
        </div>
        <div class="divider"></div>
        <div class="text-center w-50">
            <div class="info-label">🔖 เลขรายการ</div>
            <div id="displayReqId" class="info-value">กำลังโหลด...</div>
        </div>
    </div>
    
    <div class="mb-4">
        <label class="fw-bold mb-2 text-dark">เลือกระบบการสอบ:</label>
        <div class="d-flex flex-wrap gap-2 radio-group">
            <input type="radio" class="btn-check" name="examType" id="osce" value="OSCE" checked onclick="handleExamChange(this.value)">
            <label class="btn btn-outline-dark px-4" for="osce">OSCE</label>
            <input type="radio" class="btn-check" name="examType" id="exam" value="Exam+" onclick="handleExamChange(this.value)">
            <label class="btn btn-outline-dark px-4" for="exam">Exam+</label>
            <input type="radio" class="btn-check" name="examType" id="crq" value="CRQ" onclick="handleExamChange(this.value)">
            <label class="btn btn-outline-dark px-4" for="crq">CRQ</label>
            <input type="radio" class="btn-check" name="examType" id="none" value="ไม่ได้ใช้สำหรับสอบ" onclick="handleExamChange(this.value)">
            <label class="btn btn-outline-dark px-4" for="none">ไม่ได้ใช้สำหรับสอบ</label>
        </div>
        <div id="examHint" class="alert alert-light hint-box mt-3 py-2 px-3 border shadow-sm"><strong>💡 คำแนะนำ [Exam+]:</strong> ไม่ต้องปิด Bluetooth เนื่องจากปากกาต้องใช้ Bluetooth</div>
        <div id="noteContainer" class="mt-3" style="display:none;"><input type="text" id="reasonNote" class="form-control border-danger" placeholder="⚠️ ระบุเหตุผลที่ไม่ได้ใช้สำหรับสอบ..."></div>
    </div>

    <div id="itemList" class="d-flex flex-column gap-3 mb-4">
        <div class="text-center text-muted py-4">กำลังโหลดข้อมูล... ⏳</div>
    </div>

    <button class="btn btn-confirm shadow-sm" onclick="saveStep3()">ยืนยันเครื่องพร้อมสอบ</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> 
<script src="script.js"></script>
<script>
    let reqId = new URLSearchParams(window.location.search).get('reqId');
    let currentLoggerName = "ผู้ใช้งาน"; let isAdmin = false; let globalOwnerName = ""; 

    function handleExamChange(examType) {
        const hintBox = document.getElementById('examHint'); const noteContainer = document.getElementById('noteContainer'); const reasonNote = document.getElementById('reasonNote');
        hintBox.style.display = 'none'; noteContainer.style.display = 'none';
        if (examType === 'Exam+') { hintBox.style.display = 'block'; reasonNote.value = ''; } 
        else if (examType === 'ไม่ได้ใช้สำหรับสอบ') { noteContainer.style.display = 'block'; } 
        else { reasonNote.value = ''; }
    }

    async function initSystem() {
        const userId = localStorage.getItem("userId");
        if (!userId) { localStorage.setItem("pendingUrl", window.location.href); window.location.replace("index.html"); return; }

        document.getElementById('displayReqId').innerText = reqId || "ไม่พบข้อมูล";
        if(!reqId) { document.getElementById('itemList').innerHTML = '<div class="text-danger py-4 text-center">❌ ไม่พบหมายเลขรายการ</div>'; return; }

        try {
            const syncData = await callAPI({ action: "checkRole", userId: userId }).catch(() => ({ success: false }));
            const res = await callAPI({ action: "getStep2Data", reqId: reqId });
            
            if (syncData.success && syncData.name) { localStorage.setItem("userName", syncData.name); localStorage.setItem("userRole", syncData.role); }
            currentLoggerName = localStorage.getItem("userName") || "ผู้ใช้งาน"; isAdmin = localStorage.getItem("userRole") === "Admin";

            if (res.reqStatus && res.reqStatus !== "Step[2]") {
                let nextPage = isAdmin ? "admin.html" : "user.html";
                showNavyAlert("แจ้งเตือน", `รายการนี้ตรวจสอบก่อนสอบไปแล้ว (สถานะ: ${res.reqStatus})`, "warning", nextPage); return;
            }
            
            let originalBorrower = res.userName || "ไม่ระบุ";
            document.getElementById('displayUserName').innerText = originalBorrower;
            globalOwnerName = originalBorrower; const currentLoggerId = userId;

            if (res.ownerId && currentLoggerId && res.ownerId !== currentLoggerId) {
                document.getElementById('proxyAlert').style.display = "block"; document.getElementById('proxyNameDisplay').innerText = currentLoggerName;
            }

            const container = document.getElementById('itemList');
            
            if(res.data && res.data.length > 0) {
                let htmlContent = "";
                res.data.forEach(item => {
                    let adminBtn = isAdmin ? `<button type="button" class="btn btn-dark btn-sm fw-bold px-3 rounded-pill shadow-sm" onclick="tickAllInCard(this)">ติ๊กครบ</button>` : '';
                    htmlContent += `
                    <div class="ipad-card bg-white border border-2 rounded-4 overflow-hidden transition-all" data-ipad="${item.ipadId}">
                        <div class="bg-light border-bottom px-4 py-3 d-flex justify-content-between align-items-center">
                            <div class="d-flex align-items-center gap-3">
                                <input type="checkbox" class="select-ipad form-check-input m-0 shadow-sm" id="btn-${item.ipadId}" data-target="collapse-${item.ipadId}" onchange="toggleCard(this)">
                                <label for="btn-${item.ipadId}" style="cursor:pointer;" class="text-dark fw-bold fs-5 mb-0">${item.ipadId}</label>
                            </div>
                            ${adminBtn}
                        </div>
                        <div class="collapse" id="collapse-${item.ipadId}">
                            <div class="p-4 row row-cols-2 row-cols-md-3 g-3 text-center">
                                <div class="col"><label class="d-flex flex-column align-items-center gap-2 mb-0 w-100" style="cursor: pointer;"><span class="fw-bold text-dark" style="font-size: 0.9rem; min-height: 25px;">Logout Drive</span><input type="checkbox" class="check-item form-check-input m-0 shadow-sm flex-shrink-0"></label></div>
                                <div class="col"><label class="d-flex flex-column align-items-center gap-2 mb-0 w-100" style="cursor: pointer;"><span class="fw-bold text-dark" style="font-size: 0.9rem; min-height: 25px;">ปิด Wi-Fi</span><input type="checkbox" class="check-item form-check-input m-0 shadow-sm flex-shrink-0"></label></div>
                                <div class="col"><label class="d-flex flex-column align-items-center gap-2 mb-0 w-100" style="cursor: pointer;"><span class="fw-bold text-dark" style="font-size: 0.9rem; min-height: 25px;">ปิด Bluetooth</span><input type="checkbox" class="check-item form-check-input m-0 shadow-sm flex-shrink-0"></label></div>
                                <div class="col"><label class="d-flex flex-column align-items-center gap-2 mb-0 w-100" style="cursor: pointer;"><span class="fw-bold text-dark" style="font-size: 0.9rem; min-height: 25px;">ปิด AirDrop</span><input type="checkbox" class="check-item form-check-input m-0 shadow-sm flex-shrink-0"></label></div>
                                <div class="col"><label class="d-flex flex-column align-items-center gap-2 mb-0 w-100" style="cursor: pointer;"><span class="fw-bold text-dark" style="font-size: 0.9rem; min-height: 25px;">โหมดเครื่องบิน</span><input type="checkbox" class="check-item form-check-input m-0 shadow-sm flex-shrink-0"></label></div>
                                <div class="col"><label class="d-flex flex-column align-items-center gap-2 mb-0 w-100" style="cursor: pointer;"><span class="fw-bold text-dark" style="font-size: 0.9rem; min-height: 25px;">เริ่มใช้งาน</span><input type="checkbox" class="check-item form-check-input m-0 shadow-sm flex-shrink-0"></label></div>
                            </div>
                        </div>
                    </div>`;
                });
                container.innerHTML = htmlContent;
            } else { container.innerHTML = `<div class="text-danger py-4 text-center">❌ ไม่พบข้อมูล iPad</div>`; }
        } catch (error) { document.getElementById('itemList').innerHTML = `<div class="text-danger py-4 text-center fw-bold">❌ ไม่สามารถเชื่อมต่อฐานข้อมูลได้<br><span class="text-muted fw-normal" style="font-size: 0.85rem;">โปรดตรวจสอบลิงก์ API_URL</span></div>`; }
    }

    initSystem();

    function toggleCard(checkbox) {
        const targetId = checkbox.dataset.target; const collapseElement = document.getElementById(targetId);
        const bsCollapse = bootstrap.Collapse.getOrCreateInstance(collapseElement, { toggle: false }); const card = checkbox.closest('.ipad-card');
        if (checkbox.checked) { bsCollapse.show(); card.classList.add('active-card'); } 
        else { bsCollapse.hide(); card.classList.remove('active-card'); collapseElement.querySelectorAll('.check-item').forEach(cb => cb.checked = false); }
    }

    function tickAllInCard(btn) {
        const card = btn.closest('.ipad-card'); const mainCheck = card.querySelector('.select-ipad');
        if (!mainCheck.checked) { mainCheck.checked = true; toggleCard(mainCheck); }
        card.querySelectorAll('.check-item').forEach(cb => { cb.checked = true; });
        btn.classList.add('btn-ticked-all');
        card.querySelectorAll('.check-item').forEach(cb => { cb.addEventListener('change', function() { if(!this.checked) btn.classList.remove('btn-ticked-all'); }, { once: true }); });
    }

    async function saveStep3() {
        let items = []; let isAllChecked = true; 
        document.querySelectorAll('.select-ipad:checked').forEach(checkbox => {
            const card = checkbox.closest('.ipad-card'); const checks = Array.from(card.querySelectorAll('.check-item'));
            if (checks.some(c => !c.checked)) isAllChecked = false;
            const checkValues = checks.map(c => c.checked ? "☑" : "☐");
            items.push({ ipadId: card.dataset.ipad, checks: checkValues });
        });

        if(items.length === 0) return Swal.fire({ title: "⚠️ ข้อมูลไม่ครบถ้วน", text: "กรุณาติ๊กเลือกหน้าชื่อ iPad ที่พร้อมสอบ อย่างน้อย 1 เครื่องครับ!", icon: "warning", confirmButtonColor: "#212529" });
        if (!isAllChecked) return Swal.fire({ title: "⚠️ ข้อมูลไม่ครบถ้วน", text: "กรุณาตรวจสอบและติ๊กรายการให้ครบทุกข้อ สำหรับ iPad ที่เลือกครับ!", icon: "warning", confirmButtonColor: "#212529" });

        const examValueObj = document.querySelector('input[name="examType"]:checked');
        if (!examValueObj) return Swal.fire({ title: "⚠️ แจ้งเตือน", text: "กรุณาเลือกระบบการสอบ", icon: "warning", confirmButtonColor: "#212529" });
        
        const examValue = examValueObj.value; const noteValue = document.getElementById('reasonNote').value.trim();
        if (examValue === "ไม่ได้ใช้สำหรับสอบ" && noteValue === "") return Swal.fire({ title: "⚠️ ข้อมูลไม่ครบถ้วน", text: "กรุณาระบุเหตุผลที่ไม่ได้ใช้สำหรับสอบด้วยครับ!", icon: "warning", confirmButtonColor: "#212529" });

        const btn = document.querySelector('.btn-confirm'); const originalText = btn.innerText; 
        btn.innerText = "⏳ กำลังบันทึกข้อมูล..."; btn.disabled = true;
        
        try {
            const result = await callAPI({ action: "saveStep3", reqId: reqId, items: items, exam: examValue, note: noteValue, actorName: currentLoggerName, ownerName: globalOwnerName, userId: localStorage.getItem("userId") });
            if(result.status === "success") {
                let nextPage = isAdmin ? "admin.html" : "user.html";
                showNavyAlert("ตรวจก่อนสอบสำเร็จ!", `หมายเลขรายการ: <b>${reqId}</b><br>Check List จำนวน ${items.length} เครื่องเรียบร้อยแล้ว`, "success", nextPage);
            } else { Swal.fire("❌ เกิดข้อผิดพลาด", result.message, "error"); btn.innerText = originalText; btn.disabled = false; }
        } catch (error) { Swal.fire("❌ เกิดข้อผิดพลาด", "ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้", "error"); btn.innerText = originalText; btn.disabled = false; }
    }
</script>
</body>
</html>
