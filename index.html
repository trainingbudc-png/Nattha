<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | iPad Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* 📌 ธีมสี Enterprise Navy */
        :root {
            --primary-navy: #1e3a8a;
            --primary-hover: #172554;
            --bg-color: #f8fafc;
            --border-color: #cbd5e1;
            --text-dark: #1e293b;
            --text-muted: #64748b;
        }

        body { background: var(--bg-color); font-family: 'Kanit', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px 0; }
        
        .main-card { 
            background: white; 
            padding: 50px 40px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(30, 58, 138, 0.08); 
            width: 100%; 
            max-width: 450px; 
            text-align: center; 
            border: 1px solid var(--border-color);
        }
        
        .loading-section { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        .logo-wrapper { position: relative; margin-bottom: 25px; display: inline-flex; align-items: center; justify-content: center; }
        .line-icon { width: 85px; height: 85px; position: relative; z-index: 2; }
        
        /* วงแหวน Loading คงสีเขียว LINE ไว้เพื่อความสมจริง */
        .pulse-ring {
            position: absolute;
            width: 85px; height: 85px;
            background-color: #06C755;
            border-radius: 50%;
            z-index: 1;
            animation: pulseAnim 2s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes pulseAnim {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(1.8); opacity: 0; }
        }

        .loading-dots { margin-top: 10px; height: 20px; }
        .loading-dots span {
            display: inline-block; width: 10px; height: 10px;
            background-color: #06C755; border-radius: 50%; margin: 0 4px;
            animation: bounceAnim 1.4s infinite ease-in-out both;
        }
        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounceAnim {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        #mainText { font-size: 1.3rem; letter-spacing: 0.5px; color: var(--primary-navy) !important; font-weight: 700 !important; }
        #subText { font-size: 0.95rem; color: var(--text-muted); transition: all 0.3s ease; }

        .register-section { display: none; text-align: left; }
        
        /* 📌 ปรับสไตล์ Input ให้ล้อไปกับหน้าอื่น */
        .form-control, .form-select { 
            border-radius: 10px; 
            padding: 12px 15px; 
            border: 1px solid var(--border-color); 
            font-size: 0.95rem; 
            color: var(--text-dark);
        }
        .form-control:focus, .form-select:focus { 
            border-color: var(--primary-navy); 
            box-shadow: 0 0 0 0.25rem rgba(30, 58, 138, 0.15); 
        }
        
        /* 📌 เปลี่ยนปุ่มลงทะเบียนเป็น Navy */
        .btn-register { 
            background: var(--primary-navy); 
            color: white;
            border: none; 
            border-radius: 10px; 
            padding: 14px; 
            font-weight: 600; 
            font-size: 1.05rem; 
            width: 100%; 
            transition: all 0.3s ease; 
            margin-top: 20px; 
        }
        .btn-register:hover { 
            background: var(--primary-hover); 
            transform: translateY(-2px); 
            box-shadow: 0 6px 15px rgba(30, 58, 138, 0.3); 
            color: white;
        }
        
        .form-label { font-weight: 600; color: var(--text-dark); font-size: 0.9rem; margin-bottom: 6px; }
    </style>
</head>
<body>

<div class="main-card">
    <div id="loadingSection" class="loading-section">
        <div class="logo-wrapper">
            <div class="pulse-ring" id="pulseRing"></div>
            <img src="https://upload.wikimedia.org/wikipedia/commons/4/41/LINE_logo.svg" alt="LINE" class="line-icon">
        </div>
        <h4 class="fw-bold" id="mainText">กำลังตรวจสอบบัญชี</h4>
        <div class="loading-dots" id="spinnerIcon">
            <span></span><span></span><span></span>
        </div>
        <p class="mt-2" id="subText">ระบบกำลังเชื่อมต่อข้อมูลกับแอป LINE</p>
    </div>

    <div id="registerSection" class="register-section">
        <div class="text-center mb-4">
            <h4 class="fw-bold mb-1" style="color: var(--primary-navy);">📝 ข้อมูลผู้ใช้งานครั้งแรก</h4>
            <p class="text-muted" style="font-size: 0.85rem;">กรุณาเติมข้อมูลให้ครบถ้วนเพื่อเปิดใช้งานระบบ</p>
        </div>
        
        <input type="hidden" id="hiddenUserId">

        <div class="row mb-3 g-2">
            <div class="col-6">
                <label class="form-label">ชื่อจริง</label>
                <input type="text" id="regFirstName" class="form-control" placeholder="ชื่อจริง">
            </div>
            <div class="col-6">
                <label class="form-label">นามสกุล</label>
                <input type="text" id="regLastName" class="form-control" placeholder="นามสกุล">
            </div>
        </div>
        
        <div class="mb-3">
            <label class="form-label">ชื่อเล่น <span class="text-muted fw-normal" style="font-size: 0.8rem;">(เปลี่ยนได้ ไม่มีผลกับระบบ)</span></label>
            <input type="text" id="regNickname" class="form-control" placeholder="เช่น นัท, เฟธ">
        </div>
        
        <div class="mb-3">
            <label class="form-label">ฝ่าย / แผนก</label>
            <select id="regDept" class="form-select" required>
                <option value="">กำลังโหลดรายชื่อแผนก... ⏳</option>
            </select>
        </div>
        
        <div class="mb-4">
            <label class="form-label">เบอร์ติดต่อภายใน (หรือมือถือ)</label>
            <input type="text" id="regPhone" class="form-control" placeholder="กรอกเบอร์ที่สามารถติดต่อได้">
        </div>
        
        <button class="btn-register" id="btnRegister" onclick="submitRegistration()">✅ ยืนยันข้อมูล & เข้าใช้งาน</button>
    </div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<!-- 📌 ดึงลิงก์ API และ LIFF_ID มาจาก script.js -->
<script src="script.js"></script>

<script>
    window.onload = async () => {
        // ⚡ ระบบ Fast Login (ข้ามหน้าโหลดใน 0.5 วิ)
        const savedUserId = localStorage.getItem("userId");
        const savedRole = localStorage.getItem("userRole");
        const savedName = localStorage.getItem("userName");

        if (savedUserId && savedRole && savedName) {
            document.getElementById('mainText').innerText = "✅ ยืนยันตัวตนสำเร็จ";
            document.getElementById('subText').innerText = `สวัสดีคุณ ${savedName} กำลังพาท่านเข้าสู่ระบบ...`;
            document.getElementById('spinnerIcon').style.display = "none";
            document.getElementById('pulseRing').style.display = "none";
            
            setTimeout(() => {
                window.location.replace(savedRole === "Admin" ? "admin.html" : "user.html");
            }, 600);
            return;
        }

        try {
            await liff.init({ liffId: LIFF_ID });
            
            if (!liff.isLoggedIn()) {
                liff.login();
                return;
            }

            const profile = await liff.getProfile();
            const displayName = profile.displayName;
            const userId = profile.userId; 

            document.getElementById('subText').innerText = `สวัสดีคุณ ${displayName} กำลังตรวจสอบสิทธิ์...`;
            
            // 📌 เริ่มฟังก์ชันยิง API
            checkUserInDatabase(userId, displayName);

        } catch (err) {
            console.error("LIFF Error:", err);
            showError("เกิดข้อผิดพลาดในการเชื่อมต่อ", "กรุณาเปิดลิงก์ผ่านแอปพลิเคชัน LINE");
        }
    };

    // 📌 ฟังก์ชันตรวจสอบสิทธิ์พร้อมระบบ Smart Feedback & Auto-Retry
    async function checkUserInDatabase(userId, displayName, retryCount = 3) {
        
        // 💡 UX Trick: ถ้าใช้เวลาโหลดนานเกิน 2.5 วินาที ให้เปลี่ยนข้อความบอกผู้ใช้
        const slowLoadTimer = setTimeout(() => {
            document.getElementById('subText').innerHTML = `กำลังปลุกเซิร์ฟเวอร์ฐานข้อมูล... ⏳<br><span style="font-size: 0.8rem; color: #94a3b8;">(อาจใช้เวลา 3-5 วินาที)</span>`;
        }, 2500);

        try {
            const res = await fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({ action: "checkRole", userId: userId })
            });
            const data = await res.json();

            clearTimeout(slowLoadTimer); // ยกเลิกการเปลี่ยนข้อความถ้าโหลดเสร็จก่อน 2.5 วิ

            if (data.success) {
                document.getElementById('mainText').innerText = "✅ ยืนยันตัวตนสำเร็จ";
                document.getElementById('subText').innerText = "กำลังพาท่านเข้าสู่ระบบ...";
                document.getElementById('spinnerIcon').style.display = "none";
                document.getElementById('pulseRing').style.display = "none";
                
                localStorage.setItem("userName", data.name);
                localStorage.setItem("userRole", data.role);
                localStorage.setItem("userId", userId); 
                
                setTimeout(() => {
                    window.location.replace(data.role === "Admin" ? "admin.html" : "user.html");
                }, 1000);
            } else {
                document.getElementById('loadingSection').style.display = "none";
                document.getElementById('registerSection').style.display = "block";
                
                document.getElementById('hiddenUserId').value = userId;
                
                let nameParts = displayName.split(" ");
                document.getElementById('regFirstName').value = nameParts[0] || "";
                document.getElementById('regLastName').value = nameParts.slice(1).join(" ") || "";
                
                // 📌 สร้าง Dropdown ทันทีไม่ต้องรอ
                const selectDept = document.getElementById('regDept');
                if (data.departments && data.departments.length > 0) {
                    selectDept.innerHTML = '<option value="">-- กรุณาเลือกแผนกของคุณ --</option>';
                    data.departments.forEach(dept => {
                        selectDept.innerHTML += `<option value="${dept}">${dept}</option>`;
                    });
                } else {
                    selectDept.innerHTML = '<option value="">(ไม่พบข้อมูลแผนก)</option>';
                }
            }
        } catch (error) {
            clearTimeout(slowLoadTimer);
            if (retryCount > 0) {
                // แอบ Retry ใหม่ถ้าขัดข้อง
                document.getElementById('subText').innerText = `สัญญาณขัดข้อง กำลังลองใหม่... (เหลือ ${retryCount} ครั้ง)`;
                setTimeout(() => checkUserInDatabase(userId, displayName, retryCount - 1), 1500);
            } else {
                showError("เซิร์ฟเวอร์ไม่ตอบสนอง", "ไม่สามารถตรวจสอบข้อมูลกับฐานข้อมูลได้");
            }
        }
    }

    async function submitRegistration() {
        const userId = document.getElementById('hiddenUserId').value;
        const firstName = document.getElementById('regFirstName').value.trim();
        const lastName = document.getElementById('regLastName').value.trim();
        const nickname = document.getElementById('regNickname').value.trim();
        const dept = document.getElementById('regDept').value.trim();
        let phone = document.getElementById('regPhone').value.trim();

        if (!firstName || !lastName || !dept || !phone) {
            return alert("⚠️ กรุณากรอก ชื่อ, นามสกุล, แผนก และเบอร์โทร ให้ครบถ้วนครับ");
        }

        // 🚀 บังคับเติมขีดกลางให้เบอร์โทร
        phone = phone.replace(/-/g, ""); 
        if (phone.length === 10) {
            phone = phone.substring(0, 3) + "-" + phone.substring(3, 6) + "-" + phone.substring(6);
        } else {
            phone = "Tel. " + phone; 
        }

        const fullName = firstName + " " + lastName;
        const btn = document.getElementById('btnRegister');
        btn.innerText = "⏳ กำลังบันทึกข้อมูล..."; btn.disabled = true;

        try {
            const res = await fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({ 
                    action: "registerUser", 
                    userId: userId, 
                    name: fullName, 
                    nickname: nickname,
                    role: "User", 
                    dept: dept, 
                    phone: phone 
                })
            });
            const data = await res.json();

            if (data.status === "success") {
                alert("✅ ลงทะเบียนสำเร็จ! ระบบกำลังพาท่านเข้าสู่ระบบ...");
                localStorage.setItem("userName", fullName);
                localStorage.setItem("userRole", "User");
                localStorage.setItem("userId", userId); 

                window.location.replace("user.html");
            } else {
                alert("❌ เกิดข้อผิดพลาดในการบันทึก");
                btn.innerText = "✅ ยืนยันข้อมูล & เข้าใช้งาน"; btn.disabled = false;
            }
        } catch (error) {
            alert("❌ ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้");
            btn.innerText = "✅ ยืนยันข้อมูล & เข้าใช้งาน"; btn.disabled = false;
        }
    }

    function showError(main, sub) {
        document.getElementById('spinnerIcon').style.display = "none";
        document.getElementById('pulseRing').style.display = "none";
        document.getElementById('mainText').innerText = "❌ " + main;
        document.getElementById('mainText').classList.add("text-danger");
        document.getElementById('subText').innerText = sub;
    }
</script>
</body>
</html>
