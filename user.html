<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าผู้ใช้งาน | ระบบ iPad</title>
    
    <link rel="icon" href="https://github.com/trainingbudc-png/Nattha/blob/main/%E0%B8%A3%E0%B8%B9%E0%B8%9B.png?raw=true" type="image/png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="theme-user.css">

    <style>
        .container-wide, .nav-header {
            max-width: 1280px !important;
            margin: 0 auto !important;
        }
        .container-wide {
            padding-left: 20px !important;
            padding-right: 20px !important;
        }
        /* บีบตารางให้เพรียวบางสวยงามกระชับ */
        .table th { padding: 12px !important; font-size: 0.95rem; }
        .table td { padding: 8px 12px !important; font-size: 0.9rem; vertical-align: middle; }
        
        /* 📌 สไตล์การ์ดงาน Active แบบ Dropdown สุดเท่ */
        .active-task-card {
            border: 1px solid #fecaca;
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
        }
        .active-task-card:hover {
            box-shadow: 0 4px 15px rgba(220,53,69,0.1) !important;
            border-color: #dc3545;
        }
        .collapse-icon {
            transition: transform 0.3s ease;
            display: inline-block;
        }
        [aria-expanded="true"] .collapse-icon {
            transform: rotate(180deg);
        }
    </style>
</head>
<body>

    <!-- 🟢 Navbar -->
    <nav class="nav-header">
        <div class="nav-title d-flex align-items-center gap-2">
            <img src="https://github.com/trainingbudc-png/Nattha/blob/main/%E0%B8%A3%E0%B8%B9%E0%B8%9B.png?raw=true" alt="Logo" style="width: 28px; height: 28px; object-fit: contain;">
            เมนูผู้ใช้งาน
        </div>

        <div class="d-flex align-items-center gap-2">
            <span class="text-primary fw-bold d-none d-sm-inline">สวัสดี, <span id="showName">Loading...</span></span>
            
            <button class="btn btn-light btn-sm rounded-circle shadow-sm border" onclick="openProfileModal()" title="แก้ไขข้อมูลส่วนตัว" style="width: 35px; height: 35px; display: flex; align-items: center; justify-content: center;">
                ⚙️
            </button>
            
            <button class="btn btn-outline-danger btn-sm rounded-pill px-3 fw-bold" onclick="logoutSystem()">ออกจากระบบ</button>
        </div>
    </nav>

    <div class="container-wide pb-5">
        
        <!-- 📌 ส่วนที่ 1: รายการที่กำลังดำเนินการ (Active) แปลงเป็น Card -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end mt-4 mb-3 gap-2">
            <div class="d-flex align-items-center gap-2">
                <div style="width: 4px; height: 20px; background-color: #dc3545; border-radius: 2px;"></div>
                <h5 class="fw-bold m-0 text-dark">รายการที่กำลังดำเนินการ (Active)</h5>
            </div>
            <button class="btn btn-outline-dark btn-sm rounded-pill px-3 fw-bold bg-white shadow-sm border-2" onclick="loadUserTableData()">🔄 อัปเดต</button>
        </div>
        
        <!-- พื้นที่สำหรับใส่ Card งาน -->
        <div class="row g-3 mb-5" id="activeCardsContainer">
            <div class="col-12 text-center py-5 text-muted bg-white rounded-4 border">กำลังโหลดข้อมูล... ⏳</div>
        </div>

        <!-- 📌 ส่วนที่ 2: ประวัติอุปกรณ์ของฉัน (History) ยังคงเป็นตาราง -->
        <div class="d-flex align-items-center gap-2 mb-3">
            <div style="width: 4px; height: 20px; background-color: #212529; border-radius: 2px;"></div>
            <h5 class="fw-bold m-0 text-dark">ประวัติอุปกรณ์ของฉัน (เสร็จสิ้น)</h5>
        </div>
        
        <div class="table-card table-responsive shadow-sm" style="border-radius: 12px; overflow: hidden; border: 1px solid #e9ecef;">
            <table class="table table-hover align-middle mb-0">
                <!-- 📌 ปรับหัวตารางให้สว่างขึ้นด้วย class table-light -->
                <thead class="table-light text-secondary">
                    <tr class="text-center">
                        <th style="width: 20%; padding: 15px;">เลขรายการ</th>
                        <th style="width: 20%; padding: 15px;">อุปกรณ์ที่ยืม</th>
                        <th style="width: 40%; padding: 15px;">เครื่องที่เตรียม</th>
                        <th style="width: 20%; padding: 15px;">สถานะปัจจุบัน</th>
                    </tr>
                </thead>
                <tbody id="historyTableBody" class="bg-white">
                    <tr><td colspan="4" class="text-center py-4 text-muted">กำลังโหลดข้อมูล... ⏳</td></tr>
                </tbody>
            </table>
        </div>

    </div>

    <!-- Modal แก้ไขข้อมูลส่วนตัว -->
    <div class="modal fade" id="profileModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border-radius: 16px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
                <div class="modal-header border-0 pb-0 mt-3 d-flex flex-column align-items-center position-relative">
                    <button type="button" class="btn-close position-absolute top-0 end-0 me-3" data-bs-dismiss="modal" aria-label="Close"></button>
                    <h4 class="modal-title fw-bold text-dark">⚙️ แก้ไขข้อมูลส่วนตัว</h4>
                    <p class="text-muted mb-0" style="font-size: 0.9rem;">อัปเดตข้อมูลของคุณให้เป็นปัจจุบัน</p>
                </div>
                <div class="modal-body p-4 pt-3">
                    <div class="row mb-3">
                        <div class="col-6">
                            <label class="form-label fw-bold" style="color: #2c3e50; font-size: 0.9rem;">ชื่อจริง</label>
                            <input type="text" id="editProfileFirstName" class="form-control" style="border-radius: 8px;">
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-bold" style="color: #2c3e50; font-size: 0.9rem;">นามสกุล</label>
                            <input type="text" id="editProfileLastName" class="form-control" style="border-radius: 8px;">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold" style="color: #2c3e50; font-size: 0.9rem;">
                            ชื่อเล่น <span class="fw-normal text-muted" style="font-size: 0.8rem;">(เปลี่ยนได้ ไม่มีผลกับระบบ)</span>
                        </label>
                        <input type="text" id="editProfileNickname" class="form-control" placeholder="เช่น นัท, เฟธ" style="border-radius: 8px;">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold" style="color: #2c3e50; font-size: 0.9rem;">ฝ่าย / แผนก</label>
                        <select id="editProfileDept" class="form-select" style="border-radius: 8px;">
                            <option value="">-- กรุณาเลือกแผนกของคุณ --</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold" style="color: #2c3e50; font-size: 0.9rem;">เบอร์ติดต่อภายใน (หรือมือถือ)</label>
                        <input type="tel" id="editProfilePhone" class="form-control" placeholder="กรอกเบอร์ที่สามารถติดต่อได้" style="border-radius: 8px;">
                    </div>
                    <!-- 📌 ปุ่มกดเข้าธีมสีดำเข้ม -->
                    <button type="button" class="btn w-100 fw-bold py-2 shadow-sm" id="btnSaveProfile" onclick="saveProfileData()" style="background-color: #212529; color: white; border-radius: 8px; font-size: 1.05rem; transition: 0.2s;">
                        บันทึกข้อมูลส่วนตัว
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 📌 โหลด Bootstrap ให้ Card แบบ Collapse ทำงานได้ -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="script.js"></script>
    <script src="user.js"></script>

</body>
</html>
