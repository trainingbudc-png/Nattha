<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 5 List | ตรวจรับคืน</title>
    <link rel="icon" href="https://github.com/trainingbudc-png/Nattha/blob/main/%E0%B8%A3%E0%B8%B9%E0%B8%9B.png?raw=true" type="image/png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme-admin.css">
    
    <style>
        body { 
            background: var(--admin-bg, #f8f9fa); 
            font-family: 'Kanit', sans-serif; 
            padding-bottom: 40px; 
        }
        
        .container-wide { max-width: 1280px !important; margin: 0 auto !important; padding-left: 20px !important; padding-right: 20px !important; }

        .accent-bar-admin {
            width: 4px; height: 22px;
            background-color: var(--admin-main, #1e3a8a);
            display: inline-block;
            margin-right: 10px;
            border-radius: 2px;
        }

        /* 💻 สไตล์ตาราง (หัวสีน้ำเงินแอดมิน) */
        .table-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        .table thead {
            background-color: var(--admin-main, #1e3a8a);
            color: white;
        }
        
        .table thead th {
            font-weight: 500;
            border: none;
            padding: 14px 10px;
        }

        .table tbody tr {
            border-bottom: 1px solid #f1f5f9;
        }
        .table tbody tr:last-child {
            border-bottom: none;
        }

        .btn-action-admin {
            background-color: white;
            color: var(--admin-main, #1e3a8a);
            border: 1px solid var(--admin-main, #1e3a8a);
            border-radius: 10px;
            padding: 6px 20px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-action-admin:hover {
            background-color: var(--admin-main, #1e3a8a);
            color: white;
        }

        /* 📱 Mobile */
        @media (max-width: 768px) {
            .table-card { background: transparent !important; box-shadow: none !important; border: none !important; margin-top: 10px; }
            .table thead { display: none !important; }
            .table tbody tr { 
                display: block; background: #ffffff; border-radius: 16px; margin-bottom: 16px; padding: 16px 20px; 
                box-shadow: 0 4px 15px rgba(0,0,0,0.04); border: 1px solid #e2e8f0 !important; 
            }
            .table tbody td { 
                display: flex; justify-content: space-between; align-items: center; text-align: right; 
                padding: 10px 0; border-bottom: 1px dashed #e2e8f0 !important; 
            }
            .table tbody td::before { 
                content: attr(data-label); font-weight: 600; color: #475569; font-size: 0.95rem; text-align: left; margin-right: 15px; flex-shrink: 0; 
            }
            .table tbody td:first-child { border-bottom: 2px solid var(--admin-main, #1e3a8a) !important; padding-top: 0; }
            .table tbody td:last-child { border-bottom: none !important; padding-bottom: 0; padding-top: 14px; display: block; }
            .table tbody td:last-child::before { display: none; } 
            .table tbody td:last-child .btn-action-admin { background-color: var(--admin-main, #1e3a8a); color: white; width: 100%; padding: 12px !important; font-size: 1.05rem; }
        }
    </style>
</head>
<body>

    <!-- 📌 แก้ไข: ถอดคลาสที่มีปัญหาออก แล้วใช้ Inline Style บังคับให้อยู่บรรทัดเดียวกันแน่นอน 100% -->
    <nav style="display: flex !important; justify-content: space-between !important; align-items: center !important; flex-wrap: nowrap !important; max-width: 1280px; margin: 0 auto; padding: 20px;" class="mt-2 mb-2">
        <div class="fw-bold text-dark" style="line-height: 1.2; font-size: 1.15rem; flex-grow: 1;">
            🔍 Step 5 | ตรวจรับคืน
            <span class="d-block d-sm-inline" style="font-size: 0.95rem; color: #6c757d; font-weight: 500; margin-left: 4px;">(ค้างดำเนินการ)</span>
        </div>
        <div style="flex-shrink: 0;">
            <a href="admin.html" class="btn btn-outline-dark btn-sm rounded-pill px-4 py-1 fw-bold shadow-sm">กลับเมนู</a>
        </div>
    </nav>

    <div class="container-wide pb-5">
        
        <div class="d-flex align-items-center mb-3">
            <div class="accent-bar-admin"></div>
            <h5 class="fw-bold m-0" style="color: var(--admin-main, #1e3a8a); font-size: 1.1rem;">รายการที่ผู้ใช้งานส่งคืนรอตรวจสอบ</h5>
        </div>
        
        <div class="table-card table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                    <tr class="text-center">
                        <th style="width: 15%;">เลขรายการ</th>
                        <th style="width: 15%;">วันที่และเวลา</th>
                        <th style="width: 20%;">ผู้ส่งคืน</th>
                        <th style="width: 18%;">อุปกรณ์ที่ยืม</th>
                        <th style="width: 18%;">เครื่องที่เตรียม</th>
                        <th style="width: 14%;">จัดการ</th>
                    </tr>
                </thead>
                <tbody id="requestListBody">
                    <tr><td colspan="6" class="text-center py-5 text-muted fw-bold">กำลังเชื่อมต่อข้อมูล... ⏳</td></tr>
                </tbody>
            </table>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="script.js"></script> 
<script>
    window.onload = function() {
        if(localStorage.getItem("userRole") !== "Admin") { window.location.href = "index.html"; return; }
        loadStep5List();
    };

    function loadStep5List() {
        const tbody = document.getElementById("requestListBody");
        tbody.innerHTML = '<tr><td colspan="6" class="text-center py-5 text-muted fw-bold">กำลังดึงข้อมูล... ⏳</td></tr>'; 
        
        fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getData" }) })
        .then(res => res.json())
        .then(res => {
            tbody.innerHTML = ""; 
            if (res.status === "success" && res.data && res.data.length > 0) {
                
                const pendingData = res.data.filter(item => 
                    item.status && (item.status.includes("รอตรวจสอบ") || item.status.includes("รอแอดมินตรวจ") || item.status.includes("รอตรวจรับ") || item.status.includes("Step[4]"))
                );

                if (pendingData.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center text-success fw-bold py-5">🎉 ไม่มีรายการรอตรวจสอบรับคืนในขณะนี้</td></tr>';
                    return;
                }

                pendingData.forEach(item => {
                    let dateStr = item.timestamp ? new Date(item.timestamp).toLocaleString("th-TH") : "-";
                    dateStr = dateStr.replace(/:\d{2}$/, '');
                    let fullName = item.name || "-";
                    
                    let typeHtml = '<span class="text-muted">-</span>';
                    let idsHtml = '<span class="text-muted">-</span>';
                    
                    if (item.ipadId && item.ipadId.trim() !== "") {
                        let rawIpads = item.ipadId.split(',').map(id => id.trim());
                        let normalIds = [], airIds = [];

                        rawIpads.forEach(id => {
                            let numMatch = id.match(/\d+/); 
                            let num = numMatch ? numMatch[0] : id; 
                            if (id.toLowerCase().includes("air") || id.toLowerCase().includes("apc")) {
                                airIds.push(num);
                            } else {
                                normalIds.push(num);
                            }
                        });

                        let typeArr = [];
                        let idsArr = [];
                        
                        if (normalIds.length > 0) {
                            typeArr.push(`<div class="fw-bold mb-1" style="color: var(--admin-main, #1e3a8a);">iPad</div>`);
                            idsArr.push(`<div class="mb-1 text-dark" style="word-break: break-word; line-height: 1.6;">${normalIds.join(', ')}</div>`);
                        }
                        if (airIds.length > 0) {
                            typeArr.push(`<div class="fw-bold text-secondary mb-1">Air+APC</div>`);
                            idsArr.push(`<div class="mb-1 text-dark" style="word-break: break-word; line-height: 1.6;">${airIds.join(', ')}</div>`);
                        }
                        
                        typeHtml = typeArr.join('');
                        idsHtml = idsArr.join('');
                    }

                    tbody.innerHTML += `
                        <tr class="text-center align-middle">
                            <td data-label="เลขรายการ"><div class="fw-bold" style="color: var(--admin-main, #1e3a8a);">${item.reqId}</div></td>
                            <td data-label="วันที่และเวลา"><div class="text-muted" style="font-size: 0.9rem;">${dateStr}</div></td>
                            <td data-label="ผู้ส่งคืน"><div class="fw-bold text-dark">${fullName}</div></td>
                            <td data-label="อุปกรณ์ที่ยืม">${typeHtml}</td>
                            <td data-label="เครื่องที่เตรียม">${idsHtml}</td>
                            <td data-label="จัดการ">
                                <button class="btn-action-admin shadow-sm w-100" onclick="goToStep5('${item.reqId}')">ตรวจสอบ</button>
                            </td>
                        </tr>
                    `;
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-5">ไม่มีข้อมูลในระบบ</td></tr>';
            }
        })
        .catch(err => {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-danger py-5">❌ เกิดข้อผิดพลาดในการเชื่อมต่อฐานข้อมูล</td></tr>';
        });
    }

    function goToStep5(reqId) {
        window.location.href = `step5.html?reqId=${reqId}`;
    }
</script>
</body>
</html>
