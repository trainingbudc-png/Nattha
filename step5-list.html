<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 5 List | ตรวจรับคืน</title>
    <link rel="icon" href="https://github.com/trainingbudc-png/Nattha/blob/main/%E0%B8%A3%E0%B8%B9%E0%B8%9B.png?raw=true" type="image/png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme-admin.css">
    
    <style>
        body { background: var(--admin-bg); font-family: 'Kanit', sans-serif; padding-bottom: 40px; }
        
        .accent-bar-admin {
            width: 5px; height: 24px;
            background-color: var(--admin-accent);
            border-radius: 4px;
            display: inline-block;
            margin-right: 10px;
        }

        /* 📱 โครงสร้าง Card แท้สำหรับมือถือ */
        .step5-item-card {
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            padding: 20px;
            margin-bottom: 16px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 10px 0;
            border-bottom: 1px dashed #e2e8f0;
        }

        .info-label {
            font-weight: 600;
            color: #475569;
            font-size: 0.95rem;
            flex-shrink: 0;
            min-width: 110px;
            text-align: left;
        }

        .info-value {
            font-size: 0.95rem;
            color: #1e293b;
            text-align: right;
            word-break: break-word;
            flex-grow: 1;
        }

        .status-badge-custom {
            background-color: #fef3c7;
            color: #d97706;
            border: 1px solid #fde68a;
            padding: 3px 12px;
            border-radius: 50rem;
            font-size: 0.85rem;
            font-weight: 700;
            display: inline-block;
        }

        /* ปุ่มมือถือ */
        .btn-submit-action {
            background-color: var(--admin-main);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn-submit-action:hover {
            background-color: var(--admin-hover);
            color: white;
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.3);
        }

        /* 💻 โครงสร้าง Table สำหรับคอมพิวเตอร์ */
        .table-custom-header {
            background-color: #f8fafc !important; /* สีเทาอ่อนเหมือนในรูป */
            border-bottom: 2px solid #e2e8f0 !important;
            color: #475569;
            font-size: 0.95rem;
        }
        
        .desktop-action-btn {
            background-color: white;
            color: var(--admin-main);
            border: 1px solid var(--admin-main);
            border-radius: 50rem;
            padding: 4px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .desktop-action-btn:hover {
            background-color: var(--admin-main);
            color: white;
        }
    </style>
</head>
<body>

    <div class="nav-header-custom shadow-sm mb-4 d-flex justify-content-between align-items-center" style="padding: 15px 20px;">
        <div class="nav-title-custom fw-bold text-white lh-sm m-0">
            🔍 Step 5 | ตรวจรับคืน
            <!-- มือถือปัดตกบรรทัด / คอมอยู่บรรทัดเดียวกัน -->
            <span class="d-block d-sm-inline text-light opacity-75 mt-1 mt-sm-0" style="font-size: 0.85rem; font-weight: 500;">(ค้างดำเนินการ)</span>
        </div>
        <div>
            <a href="admin.html" class="btn btn-light text-dark btn-sm rounded-pill fw-bold px-3 py-1 shadow-sm">กลับเมนู</a>
        </div>
    </div>

    <!-- ขยาย max-width ให้กว้างขึ้นเพื่อรองรับตารางในคอมพิวเตอร์ -->
    <div class="container" style="max-width: 1000px;">
        
        <!-- ส่วนหัวข้อรายการ แบบโปร่งใส (ไม่มีกล่องสีขาวครอบ) -->
        <div class="d-flex align-items-center mb-3 px-2">
            <div class="accent-bar-admin"></div>
            <h5 class="fw-bold m-0" style="color: var(--admin-main);">รายการที่ผู้ใช้งานส่งคืน</h5>
        </div>
        
        <!-- ข้อความโหลด / ว่างเปล่า -->
        <div id="loadingState" class="text-center py-5 text-muted fw-bold bg-white rounded-4 border shadow-sm">กำลังเชื่อมต่อข้อมูล... ⏳</div>
        <div id="emptyState" class="text-center text-success fw-bold py-5 bg-white rounded-4 border shadow-sm d-none">🎉 ไม่มีรายการรอตรวจสอบรับคืนในขณะนี้</div>

        <!-- 💻 มุมมองคอมพิวเตอร์ (ตาราง) ซ่อนในจอมือถือ -->
        <div id="desktopView" class="table-responsive bg-white rounded-4 border shadow-sm d-none d-lg-block" style="display: none;">
            <table class="table table-borderless table-hover mb-0">
                <thead>
                    <tr class="table-custom-header text-center">
                        <th class="py-3 px-4 text-start">เลขรายการ</th>
                        <th class="py-3">วันที่และเวลา</th>
                        <th class="py-3">ผู้ส่งคืน</th>
                        <th class="py-3">อุปกรณ์ที่ยืม</th>
                        <th class="py-3">เครื่องที่เตรียม</th>
                        <th class="py-3">สถานะ</th>
                        <th class="py-3 text-end px-4">จัดการ</th>
                    </tr>
                </thead>
                <tbody id="desktopTableBody">
                    <!-- ข้อมูลตารางจะถูกใส่ตรงนี้ -->
                </tbody>
            </table>
        </div>

        <!-- 📱 มุมมองมือถือ (การ์ด) ซ่อนในจอคอมพิวเตอร์ -->
        <div id="mobileView" class="d-block d-lg-none" style="display: none;">
            <!-- ข้อมูลการ์ดจะถูกใส่ตรงนี้ -->
        </div>

    </div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="script.js"></script> 
<script>
    window.onload = function() {
        if(localStorage.getItem("userRole") !== "Admin") { window.location.href = "index.html"; return; }
        loadStep5List();
    };

    function loadStep5List() {
        const loading = document.getElementById("loadingState");
        const empty = document.getElementById("emptyState");
        const desktopView = document.getElementById("desktopView");
        const desktopBody = document.getElementById("desktopTableBody");
        const mobileView = document.getElementById("mobileView");

        // รีเซ็ตสถานะการแสดงผลก่อนดึงข้อมูล
        loading.classList.remove("d-none");
        empty.classList.add("d-none");
        desktopView.classList.remove("d-lg-block");
        mobileView.classList.remove("d-block");
        desktopView.style.display = "none";
        mobileView.style.display = "none";
        desktopBody.innerHTML = "";
        mobileView.innerHTML = "";
        
        fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getData" }) })
        .then(res => res.json())
        .then(res => {
            loading.classList.add("d-none");

            if (res.status === "success" && res.data && res.data.length > 0) {
                
                const pendingData = res.data.filter(item => 
                    item.status && (item.status.includes("รอตรวจสอบ") || item.status.includes("รอแอดมินตรวจ") || item.status.includes("รอตรวจรับ") || item.status.includes("Step[4]"))
                );

                if (pendingData.length === 0) {
                    empty.classList.remove("d-none");
                    return;
                }

                // เปิดการแสดงผลคอนเทนเนอร์เมื่อมีข้อมูล
                desktopView.style.display = "";
                desktopView.classList.add("d-lg-block");
                mobileView.style.display = "";
                mobileView.classList.add("d-block");

                pendingData.forEach(item => {
                    let dateStr = item.timestamp ? new Date(item.timestamp).toLocaleString("th-TH") : "-";
                    dateStr = dateStr.replace(/:\d{2}$/, '');
                    
                    let deviceData = parseDeviceData(item.ipadId);
                    let fullName = item.name || "-";
                    let nameHtml = `<div class="fw-bold text-dark">${fullName}</div>`;

                    // 1. เพิ่มข้อมูลสำหรับตารางในคอมพิวเตอร์
                    desktopBody.innerHTML += `
                        <tr style="vertical-align: middle; border-bottom: 1px solid #f1f5f9;">
                            <td class="py-3 px-4 fw-bold" style="color: var(--admin-main);">${item.reqId}</td>
                            <td class="py-3 text-center text-muted" style="font-size: 0.95rem;">${dateStr}</td>
                            <td class="py-3 text-center fw-bold text-dark">${fullName}</td>
                            <td class="py-3 text-center text-dark">${deviceData.type}</td>
                            <td class="py-3 text-center fw-bold" style="color: #2563eb;">${deviceData.number}</td>
                            <td class="py-3 text-center">
                                <span class="status-badge-custom">Step[4]</span>
                            </td>
                            <td class="py-3 text-end px-4">
                                <button class="desktop-action-btn" onclick="goToStep5('${item.reqId}')">ตรวจสอบ</button>
                            </td>
                        </tr>
                    `;

                    // 2. เพิ่มข้อมูลสำหรับการ์ดในมือถือ
                    mobileView.innerHTML += `
                        <div class="step5-item-card">
                            <div class="info-row" style="border-bottom: 2px solid var(--admin-main); padding-top: 0;">
                                <div class="info-label" style="color: var(--admin-main); font-weight: 700;">เลขรายการ</div>
                                <div class="info-value" style="color: var(--admin-main); font-weight: 700; font-size: 1.15rem;">${item.reqId}</div>
                            </div>
                            
                            <div class="info-row">
                                <div class="info-label">วันที่และเวลา</div>
                                <div class="info-value text-muted">${dateStr}</div>
                            </div>

                            <div class="info-row">
                                <div class="info-label">ผู้ส่งคืน</div>
                                <div class="info-value">${nameHtml}</div>
                            </div>

                            <div class="info-row">
                                <div class="info-label">อุปกรณ์ที่ยืม</div>
                                <div class="info-value fw-bold text-dark">${deviceData.type}</div>
                            </div>

                            <div class="info-row">
                                <div class="info-label">เครื่องที่เตรียม</div>
                                <div class="info-value fw-bold" style="color: #2563eb;">${deviceData.number}</div>
                            </div>

                            <div class="info-row">
                                <div class="info-label">สถานะ</div>
                                <div class="info-value">
                                    <span class="status-badge-custom">Step[4]</span>
                                </div>
                            </div>

                            <div class="pt-3">
                                <button class="btn-submit-action shadow-sm" onclick="goToStep5('${item.reqId}')">
                                    ตรวจสอบ
                                </button>
                            </div>
                        </div>
                    `;
                });
            } else {
                empty.innerHTML = '🎉 ไม่มีข้อมูลในระบบ';
                empty.classList.remove("d-none");
            }
        });
    }

    function parseDeviceData(ipadText) {
        if (!ipadText || ipadText.trim() === "") return { type: "-", number: "-" };
        
        let typeStr = [];
        let numStr = [];
        let rawIpads = ipadText.split(',').map(id => id.trim());
        
        rawIpads.forEach(id => {
            let numMatch = id.match(/\d+/); 
            let num = numMatch ? numMatch[0] : id; 
            
            if (id.toLowerCase().includes("air") || id.toLowerCase().includes("apc")) {
                if(!typeStr.includes("iPad Air")) typeStr.push("iPad Air");
            } else {
                if(!typeStr.includes("iPad")) typeStr.push("iPad");
            }
            numStr.push(num);
        });
        
        return {
            type: typeStr.join(', '),
            number: numStr.join(', ')
        };
    }

    function goToStep5(reqId) {
        window.location.href = `step5.html?reqId=${reqId}`;
    }
</script>
</body>
</html>
