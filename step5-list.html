<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 5 List | ตรวจรับคืน</title>
    <link rel="icon" href="https://github.com/trainingbudc-png/Nattha/blob/main/%E0%B8%A3%E0%B8%B9%E0%B8%9B.png?raw=true" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="theme-admin.css">
</head>
<body>

    <div class="nav-header-custom shadow-sm mb-4">
        <div class="nav-title-custom fw-bold">
            🔍 Step 5 | ตรวจรับคืน
            <span class="d-block d-sm-inline text-light opacity-75" style="font-size: 0.95rem; font-weight: 500;">(ค้างดำเนินการ)</span>
        </div>
        <div>
            <a href="admin.html" class="btn btn-light text-dark btn-sm rounded-pill fw-bold px-4">🔙 กลับเมนูแอดมิน</a>
        </div>
    </div>

    <div class="container pb-5" style="max-width: 1100px;">
        <div class="section-title mt-0 mb-3">รายการที่ผู้ใช้งานส่งคืน (รอแอดมินตรวจ)</div>
        <div class="table-card table-responsive shadow-sm">
            <table class="table table-hover align-middle bg-white">
                <thead>
                    <tr class="text-center">
                        <th style="width: 15%;">เลขรายการ</th>
                        <th style="width: 15%;">วันที่และเวลา</th>
                        <th style="width: 20%;">อุปกรณ์ที่ยืม</th>
                        <th style="width: 20%;">เครื่องที่เตรียม</th>
                        <th style="width: 15%;">สถานะ</th>
                        <th style="width: 15%;">จัดการ</th>
                    </tr>
                </thead>
                <tbody id="requestListBody">
                    <tr><td colspan="6" class="text-center py-5 text-muted">กำลังโหลดข้อมูล... ⏳</td></tr>
                </tbody>
            </table>
        </div>
    </div>

<script src="script.js"></script>    
<script>
    window.onload = async function() {
        if(localStorage.getItem("userRole") !== "Admin") { window.location.href = "index.html"; return; }

        try {
            const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getData" }) });
            const result = await res.json();
            const tbody = document.getElementById("requestListBody");
            tbody.innerHTML = "";

            if (result.status === "success" && result.data.length > 0) {
                const pendingItems = result.data.filter(item => item.status && item.status.includes("Step[4]"));
                if (pendingItems.length === 0) { tbody.innerHTML = '<tr><td colspan="6" class="text-center fw-bold py-5 text-muted">🎉 ไม่มีรายการรอตรวจรับคืนในขณะนี้</td></tr>'; return; }

                pendingItems.forEach(item => {
                    let dateStr = item.timestamp ? new Date(item.timestamp).toLocaleString("th-TH") : "-";
                    let typeHtml = '<span class="text-muted">-</span>', idsHtml = '<span class="text-muted">-</span>';
                    
                    if (item.ipadId && item.ipadId.trim() !== "") {
                        let rawIpads = item.ipadId.split(',').map(id => id.trim());
                        let normalIds = [], airIds = [];
                        rawIpads.forEach(id => {
                            let numMatch = id.match(/\d+/); let num = numMatch ? numMatch[0] : id; 
                            if (id.toLowerCase().includes("air") || id.toLowerCase().includes("apc")) { airIds.push(num); } else { normalIds.push(num); }
                        });
                        let typeArr = [], idsArr = [];
                        if (normalIds.length > 0) { typeArr.push(`<div class="fw-bold text-danger mb-1">iPad</div>`); idsArr.push(`<div class="mb-1 text-dark">${normalIds.join(', ')}</div>`); }
                        if (airIds.length > 0) { typeArr.push(`<div style="color:var(--admin-accent);" class="fw-bold mb-1">Air+APC</div>`); idsArr.push(`<div class="mb-1 text-dark">${airIds.join(', ')}</div>`); }
                        typeHtml = typeArr.join(''); idsHtml = idsArr.join('');
                    }

                    tbody.innerHTML += `
                        <tr class="text-center align-middle">
                            <td data-label="เลขรายการ" class="fw-bold text-dark">${item.reqId}</td>
                            <td data-label="วันที่และเวลา"><div style="font-size: 0.9rem;" class="text-muted">${dateStr}</div></td>
                            <td data-label="อุปกรณ์ที่ยืม">${typeHtml}</td>
                            <td data-label="เครื่องที่เตรียม">${idsHtml}</td>
                            <td data-label="สถานะ"><div><span class="badge bg-danger text-white px-3 py-2 rounded-pill shadow-sm">Step[4]</span></div></td>
                            <td data-label="จัดการ">
                                <button class="btn btn-admin btn-sm px-3 shadow-sm w-100" onclick="window.location.href='step5.html?reqId=${item.reqId}'">ตรวจสอบ</button>
                            </td>
                        </tr>
                    `;
                });
            } else { tbody.innerHTML = '<tr><td colspan="6" class="text-center text-danger py-5">❌ ไม่พบข้อมูลในระบบ</td></tr>'; }
        } catch (error) { tbody.innerHTML = '<tr><td colspan="6" class="text-center text-danger py-5">❌ เกิดข้อผิดพลาด</td></tr>'; }
    };
</script>
</body>
</html>
