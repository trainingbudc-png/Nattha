<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 5 | ตรวจรับคืน (รอดำเนินการ)</title>
    <link rel="icon" href="https://github.com/trainingbudc-png/Nattha/blob/main/%E0%B8%A3%E0%B8%B9%E0%B8%9B.png?raw=true" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme-admin.css"> 
    <style>
        body { background: #fdf2f2; font-family: 'Kanit', sans-serif; }
        
        .btn-action { background-color: #dc3545; color: white; border: none; font-weight: 600; border-radius: 8px; transition: 0.2s; }
        .btn-action:hover { background-color: #b91c1c; color: white; transform: translateY(-2px); }
        
        /* 📌 จัดระเบียบขอบหน้าจอไม่ให้ชิดขอบ */
        .container-wide, .nav-header {
            max-width: 1280px !important;
            margin: 0 auto !important;
        }
        .container-wide {
            padding-left: 20px !important;
            padding-right: 20px !important;
        }
        
        /* ตกแต่งแถบ Navbar แบบ Admin */
        .nav-header {
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px 20px; background: white; border-bottom: 2px solid #dc3545; margin-bottom: 25px;
        }
        .nav-title { font-size: 1.25rem; font-weight: bold; color: #dc3545; }
        
        /* 📱 Responsive Mobile */
        @media screen and (max-width: 768px) {
            .table-responsive { border: none !important; background: transparent !important; padding: 0 !important; box-shadow: none !important; }
            .table thead { display: none; }
            .table tbody tr { display: block; background: white; border-radius: 12px; margin-bottom: 15px; padding: 15px; box-shadow: 0 4px 12px rgba(220,53,69,0.08); border: 1px solid #fca5a5; }
            .table tbody td { display: flex; justify-content: space-between; align-items: center; text-align: right; padding: 10px 0; border-bottom: 1px dashed #fee2e2; }
            .table tbody td:last-child { border-bottom: none; padding-bottom: 0; }
            .table tbody td::before { content: attr(data-label); font-weight: 600; color: #dc3545; font-size: 0.95rem; text-align: left; margin-right: 15px; }
        }
    </style>
</head>
<body>
    <nav class="nav-header">
        <div class="nav-title">🔍 Step 5 | ตรวจรับคืน (รอดำเนินการ)</div>
        <div class="d-flex align-items-center">
            <a href="admin.html" class="btn btn-outline-danger btn-sm rounded-pill px-3 fw-bold">🔙 กลับเมนูแอดมิน</a>
        </div>
    </nav>

    <div class="container-wide pb-5">
        <div class="fw-bold text-dark mb-3" style="font-size: 1.2rem;">รายการที่ผู้ใช้งานส่งคืน (รอแอดมินตรวจ)</div>
        <div class="table-responsive bg-white rounded-3 shadow-sm p-0 p-md-3 border-0 border-md" style="border-color: #fca5a5 !important;">
            <table class="table table-hover align-middle mb-0">
                <thead class="d-none d-md-table-header-group">
                    <tr>
                        <th style="width: 15%; color: #dc3545;">เลขรายการ</th>
                        <th style="width: 20%; color: #dc3545;">วันที่และเวลา</th>
                        <th style="width: 35%; color: #dc3545;">รหัส iPad</th>
                        <th style="width: 15%; color: #dc3545;">สถานะ</th>
                        <th style="width: 15%; color: #dc3545;">จัดการ</th>
                    </tr>
                </thead>
                <tbody id="requestListBody">
                    <tr><td colspan="5" class="text-center py-5 text-muted">กำลังโหลดข้อมูล... ⏳</td></tr>
                </tbody>
            </table>
        </div>
    </div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyw2y3tAd1h-krTwcdjX67nxIWEH6ySWvKoErnJbjrxIvouq5cG8_smLZqrvJlcLvbE/exec";
    const currentUser = localStorage.getItem("userName");
    const currentRole = localStorage.getItem("userRole");

    window.onload = async function() {
        // ตรวจสอบว่าเป็น Admin เท่านั้นถึงจะเข้าหน้านี้ได้
        if(!currentUser || currentRole !== "Admin") { window.location.href = "index.html"; return; }
        
        try {
            const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getData" }) });
            const result = await res.json();
            const tbody = document.getElementById("requestListBody");
            tbody.innerHTML = "";

            if (result.status === "success" && result.data.length > 0) {
                // 📌 Admin จะเห็นรายการที่ผ่าน Step 4 มาแล้วทั้งหมด (รอตรวจรับคืน)
                const pendingRequests = result.data.filter(item => item.status && item.status.includes("Step[4]"));

                if (pendingRequests.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center fw-bold py-5 text-muted">🎉 ไม่มีรายการรอตรวจรับคืนในขณะนี้</td></tr>';
                    return;
                }

                pendingRequests.forEach(req => {
                    let dateStr = req.timestamp ? new Date(req.timestamp).toLocaleString("th-TH") : "-";
                    let formattedIpads = formatIpadText(req.ipadId);

                    tbody.innerHTML += `
                        <tr>
                            <td data-label="📌 เลขรายการ" class="fw-bold text-dark">${req.reqId}</td>
                            <td data-label="🕒 วันที่" class="text-muted" style="font-size: 0.9rem;">${dateStr}</td>
                            <td data-label="📱 รหัส iPad" style="max-width: 300px;">${formattedIpads}</td>
                            <td data-label="📊 สถานะ"><span class="badge bg-danger text-white px-3 py-2 rounded-pill">${req.status}</span></td>
                            <td data-label="⚙️ จัดการ">
                                <button class="btn btn-action btn-sm px-3 shadow-sm w-100" onclick="window.location.href='step5.html?reqId=${req.reqId}'">🔍 ตรวจสอบ</button>
                            </td>
                        </tr>
                    `;
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-danger py-5">❌ ไม่พบข้อมูลในระบบ</td></tr>';
            }
        } catch (error) {
            document.getElementById("requestListBody").innerHTML = '<tr><td colspan="5" class="text-center text-danger py-5">❌ เกิดข้อผิดพลาดในการเชื่อมต่อฐานข้อมูล</td></tr>';
        }
    };

    function formatIpadText(ipadText) {
        if (!ipadText || ipadText.trim() === "") return "-";
        let rawIpads = ipadText.split(',').map(id => id.trim());
        let normalIds = [], airIds = [];
        rawIpads.forEach(id => {
            let numMatch = id.match(/\d+/); 
            let num = numMatch ? numMatch[0] : id; 
            if (id.toLowerCase().includes("air") || id.toLowerCase().includes("apc")) airIds.push(num);
            else normalIds.push(num);
        });
        let displayGroups = [];
        if (normalIds.length > 0) displayGroups.push(`<span class="text-dark fw-bold">[iPad]</span> ${normalIds.join(', ')}`);
        if (airIds.length > 0) displayGroups.push(`<span class="text-danger fw-bold">[Air+APC]</span> ${airIds.join(', ')}`);
        return displayGroups.join('<br>');
    }
</script>
</body>
</html>
