<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 5 List | ตรวจรับคืน</title>
    <link rel="icon" href="https://github.com/trainingbudc-png/Nattha/blob/main/%E0%B8%A3%E0%B8%B9%E0%B8%9B.png?raw=true" type="image/png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme-admin.css">
    
    <style>
        body { background: var(--admin-bg); font-family: 'Kanit', sans-serif; padding-bottom: 40px; }

        .accent-bar-admin {
            width: 5px; height: 24px;
            background-color: var(--admin-accent);
            border-radius: 4px;
            display: inline-block;
            margin-right: 10px;
        }

        /* 💻 สไตล์ตารางสำหรับหน้าจอคอมพิวเตอร์ */
        .table-card {
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            overflow: hidden;
        }

        .table thead tr {
            background-color: #f8fafc;
            border-bottom: 2px solid #e2e8f0;
            color: #475569;
            font-size: 0.95rem;
        }

        .status-badge-custom {
            background-color: #fef3c7;
            color: #d97706;
            border: 1px solid #fde68a;
            padding: 3px 12px;
            border-radius: 50rem;
            font-size: 0.85rem;
            font-weight: 700;
            display: inline-block;
        }

        /* ปุ่มในจอคอมพิวเตอร์ */
        .btn-action-admin {
            background-color: white;
            color: var(--admin-main);
            border: 1px solid var(--admin-main);
            border-radius: 50rem;
            padding: 5px 18px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-action-admin:hover {
            background-color: var(--admin-main);
            color: white;
            box-shadow: 0 4px 10px rgba(30, 58, 138, 0.2);
        }

        /* 📱 ปรับแต่งตารางให้กลายเป็นการ์ดในจอมือถือ (อ้างอิงจาก step3-list.html) */
        @media (max-width: 768px) {
            .table-card { 
                background: transparent !important; 
                box-shadow: none !important; 
                border: none !important; 
            }
            .table thead { 
                display: none !important; 
            }
            .table tbody tr { 
                display: block; 
                background: #ffffff; 
                border-radius: 16px; 
                margin-bottom: 16px; 
                padding: 16px 20px; 
                box-shadow: 0 4px 15px rgba(0,0,0,0.04); 
                border: 1px solid #e2e8f0 !important; 
            }
            .table tbody td { 
                display: flex; 
                justify-content: space-between; 
                align-items: center; 
                text-align: right; 
                padding: 10px 0; 
                border-bottom: 1px dashed #e2e8f0 !important; 
            }
            .table tbody td::before { 
                content: attr(data-label); 
                font-weight: 600; 
                color: #475569; 
                font-size: 0.95rem; 
                text-align: left; 
                margin-right: 15px; 
                flex-shrink: 0; 
            }
            .table tbody td:first-child {
                border-bottom: 2px solid var(--admin-main) !important;
                padding-top: 0;
            }
            .table tbody td:last-child { 
                border-bottom: none !important; 
                padding-bottom: 0; 
                padding-top: 14px; 
                display: block; 
            }
            .table tbody td:last-child::before { 
                display: none; 
            } 
            .table tbody td:last-child .btn-action-admin { 
                background-color: var(--admin-main);
                color: white;
                border: none;
                width: 100%;
                padding: 12px !important; 
                font-size: 1.05rem; 
                border-radius: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- Header ด้านบน ใช้โครงสร้างสีขาวและขนาดเท่ากับ Step 3 เป๊ะๆ -->
    <div class="main-header-card shadow-sm mb-4 d-flex justify-content-between align-items-center" style="background: #ffffff !important; border-bottom: 1px solid #e2e8f0; padding: 15px 30px;">
        <div class="fw-bold text-dark lh-sm m-0" style="font-size: 1.1rem;">
            🔍 Step 5 | ตรวจรับคืน
            <span class="d-block d-sm-inline text-secondary opacity-75 mt-1 mt-sm-0" style="font-size: 0.85rem; font-weight: 500;">(ค้างดำเนินการ)</span>
        </div>
        <div>
            <a href="admin.html" class="btn btn-outline-dark btn-sm rounded-pill fw-bold px-3 py-1 shadow-sm">กลับเมนู</a>
        </div>
    </div>

    <div class="container-fluid px-3 px-md-5">
        
        <!-- หัวข้อรายการ -->
        <div class="d-flex align-items-center mb-3 px-1">
            <div class="accent-bar-admin"></div>
            <h5 class="fw-bold m-0" style="color: var(--admin-main);">รายการที่ผู้ใช้งานส่งคืน</h5>
        </div>
        
        <!-- ตารางแสดงข้อมูล -->
        <div class="table-card table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                    <tr class="text-center">
                        <th style="width: 15%;" class="py-3 px-4 text-start">เลขรายการ</th>
                        <th style="width: 18%;" class="py-3">วันที่และเวลา</th>
                        <th style="width: 18%;" class="py-3">ผู้ส่งคืน</th>
                        <th style="width: 15%;" class="py-3">อุปกรณ์ที่ยืม</th>
                        <th style="width: 14%;" class="py-3">เครื่องที่เตรียม</th>
                        <th style="width: 10%;" class="py-3">สถานะ</th>
                        <th style="width: 12%;" class="py-3 text-end px-4">จัดการ</th>
                    </tr>
                </thead>
                <tbody id="requestListBody">
                    <tr><td colspan="7" class="text-center py-5 text-muted fw-bold">กำลังเชื่อมต่อข้อมูล... ⏳</td></tr>
                </tbody>
            </table>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="script.js"></script> 
<script>
    window.onload = function() {
        if(localStorage.getItem("userRole") !== "Admin") { window.location.href = "index.html"; return; }
        loadStep5List();
    };

    function loadStep5List() {
        const tbody = document.getElementById("requestListBody");
        tbody.innerHTML = '<tr><td colspan="7" class="text-center py-5 text-muted fw-bold">กำลังดึงข้อมูล... ⏳</td></tr>'; 
        
        fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getData" }) })
        .then(res => res.json())
        .then(res => {
            tbody.innerHTML = ""; 
            if (res.status === "success" && res.data && res.data.length > 0) {
                
                const pendingData = res.data.filter(item => 
                    item.status && (item.status.includes("รอตรวจสอบ") || item.status.includes("รอแอดมินตรวจ") || item.status.includes("รอตรวจรับ") || item.status.includes("Step[4]"))
                );

                if (pendingData.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center text-success fw-bold py-5">🎉 ไม่มีรายการรอตรวจสอบรับคืนในขณะนี้</td></tr>';
                    return;
                }

                pendingData.forEach(item => {
                    let dateStr = item.timestamp ? new Date(item.timestamp).toLocaleString("th-TH") : "-";
                    dateStr = dateStr.replace(/:\d{2}$/, '');
                    
                    let deviceData = parseDeviceData(item.ipadId);
                    let fullName = item.name || "-";

                    tbody.innerHTML += `
                        <tr class="align-middle text-center">
                            <td data-label="เลขรายการ" class="py-3 px-4 fw-bold text-start" style="color: var(--admin-main);">${item.reqId}</td>
                            <td data-label="วันที่และเวลา" class="py-3 text-muted" style="font-size: 0.9rem;">${dateStr}</td>
                            <td data-label="ผู้ส่งคืน" class="py-3 fw-bold text-dark">${fullName}</td>
                            <td data-label="อุปกรณ์ที่ยืม" class="py-3 text-dark">${deviceData.type}</td>
                            <td data-label="เครื่องที่เตรียม" class="py-3 fw-bold" style="color: #2563eb;">${deviceData.number}</td>
                            <td data-label="สถานะ" class="py-3">
                                <span class="status-badge-custom">Step[4]</span>
                            </td>
                            <td data-label="จัดการ" class="py-3 text-end px-4">
                                <button class="btn-action-admin shadow-sm" onclick="goToStep5('${item.reqId}')">ตรวจสอบ</button>
                            </td>
                        </tr>
                    `;
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-5">ไม่มีข้อมูลในระบบ</td></tr>';
            }
        })
        .catch(err => {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center text-danger py-5">❌ เกิดข้อผิดพลาดในการเชื่อมต่อฐานข้อมูล</td></tr>';
        });
    }

    function parseDeviceData(ipadText) {
        if (!ipadText || ipadText.trim() === "") return { type: "-", number: "-" };
        
        let typeStr = [];
        let numStr = [];
        let rawIpads = ipadText.split(',').map(id => id.trim());
        
        rawIpads.forEach(id => {
            let numMatch = id.match(/\d+/); 
            let num = numMatch ? numMatch[0] : id; 
            
            if (id.toLowerCase().includes("air") || id.toLowerCase().includes("apc")) {
                if(!typeStr.includes("iPad Air")) typeStr.push("iPad Air");
            } else {
                if(!typeStr.includes("iPad")) typeStr.push("iPad");
            }
            numStr.push(num);
        });
        
        return {
            type: typeStr.join(', '),
            number: numStr.join(', ')
        };
    }

    function goToStep5(reqId) {
        window.location.href = `step5.html?reqId=${reqId}`;
    }
</script>
</body>
</html>
