<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 1 | เตรียมเครื่อง</title>
	<link rel="icon" href="https://github.com/trainingbudc-png/Nattha/blob/main/%E0%B8%A3%E0%B8%B9%E0%B8%9B.png?raw=true" type="image/png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css" />

    <link rel="stylesheet" href="theme-admin.css">
    
    <style>
        body { background: #fdf2f2; font-family: 'Kanit', sans-serif; padding: 20px; }
        .confirm-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 4px 20px rgba(220,53,69,0.05); max-width: 950px; margin: auto; border: 1px solid #fecaca; }
        .form-label { font-weight: 600; color: #495057; font-size: 0.95rem; }
        .form-control, .form-select { border-radius: 10px; border: 1px solid #fca5a5; padding: 12px 15px; }
        .form-control:focus, .form-select:focus { border-color: #dc3545; box-shadow: 0 0 0 0.25rem rgba(220, 53, 69, 0.25); }
        
        .select2-container--bootstrap-5 .select2-selection { border-radius: 10px !important; border: 1px solid #fca5a5 !important; min-height: 50px !important; font-size: 1.1rem; display: flex; align-items: center; }
        .select2-container--bootstrap-5.select2-container--focus .select2-selection { border-color: #dc3545 !important; box-shadow: 0 0 0 0.25rem rgba(220, 53, 69, 0.25) !important; }

        .category-header { background-color: #fef2f2; color: #212529; padding: 12px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; margin-bottom: 5px; border: 1px solid #fca5a5; }
        .category-header:hover { background-color: #fecaca; }
        .category-header::after { content: '▼'; font-size: 0.8rem; transition: transform 0.3s ease; }
        .category-header.collapsed::after { transform: rotate(-90deg); }

        .ipad-container { max-height: 250px; overflow-y: auto; padding: 15px; background: #fffafa; border: 1px solid #fecaca; border-radius: 0 0 8px 8px; border-top: none; margin-bottom: 15px; }
        .grid-layout { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
        .grid-layout .btn { width: 100%; margin: 0 !important; padding: 8px 5px !important; font-size: 0.95rem; text-align: center; white-space: normal; line-height: 1.2; display: flex; align-items: center; justify-content: center; min-height: 45px; border-radius: 8px; }
        .grid-full-width { grid-column: 1 / -1; text-align: center; padding: 10px 0; }

        .btn-outline-red { color: #212529; border-color: #fca5a5; font-weight: 600; background-color: white; }
        .btn-outline-red:hover { background-color: #fef2f2; border-color: #dc3545; color: #dc3545; }
        .btn-check:checked + .btn-outline-red { background-color: #dc3545; color: white; border-color: #dc3545; box-shadow: 0 4px 10px rgba(220,53,69,0.3); }

        .table-responsive { border-radius: 12px; border: 1px solid #fca5a5; overflow: hidden; }
        .table { margin-bottom: 0; }
        .table th { background-color: #fef2f2; color: #212529; font-weight: 600; text-align: center; padding: 15px; border-bottom: 2px solid #fca5a5; font-size: 0.95rem; white-space: nowrap; }
        .table td { vertical-align: middle; text-align: center; padding: 12px 10px; border-bottom: 1px solid #fee2e2; color: #1e293b; font-weight: 500; font-size: 0.95rem; }
        .table tbody tr:hover { background-color: #fff9f9; }

        .form-check-input { width: 24px !important; height: 24px !important; cursor: pointer; accent-color: #dc3545; }
        .btn-shortcut { background: white; color: #212529; border: 2px solid #dc3545; transition: 0.2s; border-radius: 50rem; font-size: 0.85rem;}
        .btn-shortcut:hover { background: #dc3545; color: white; }
        .btn-submit-custom { background-color: #dc3545; color: white; border-radius: 12px; padding: 15px; font-weight: bold; width: 100%; margin-top: 25px; transition: 0.3s; border: none; font-size: 1.1rem; }
        .btn-submit-custom:hover { background-color: #b91c1c; color: white; }

        @media (max-width: 768px) {
            .confirm-card { padding: 20px; border-radius: 16px; margin-top: 10px; }
            .table-responsive { border: none; }
            .table thead { display: none; }
            .table tbody tr { display: block; background: #ffffff; border-radius: 16px; margin-bottom: 16px; padding: 16px 20px; box-shadow: 0 4px 15px rgba(220,53,69,0.06); border: 1px solid #fecaca; }
            .table tbody td { display: flex; justify-content: space-between; align-items: center; text-align: right; padding: 12px 0; border-bottom: 1px solid #fee2e2; }
            .table tbody td::before { content: attr(data-label); font-weight: 500; color: #64748b; font-size: 0.95rem; text-align: left; margin-right: 15px; }
            .table tbody td:first-child { border-bottom: 2px solid #fca5a5 !important; padding-bottom: 16px; margin-bottom: 8px; }
            .table tbody td:last-child { border-bottom: none !important; padding-bottom: 0; padding-top: 16px; display: block; }
            .table tbody td:last-child::before { display: none; } 
            .table tbody td:last-child .btn { padding: 12px !important; font-size: 1.05rem; }
        }
    </style>
</head>
<body>
    
    <div class="confirm-card my-3 mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom border-danger border-opacity-25">
            <h4 class="text-dark fw-bold mb-0">📦 Step 1 | เตรียมเครื่อง</h4>
            <a href="admin.html" class="btn btn-outline-danger px-4 fw-bold rounded-pill border-2 btn-sm">🔙 กลับเมนูแอดมิน</a>
        </div>
        
        <form id="step1Form">
            <div class="mb-4">
                <label class="form-label">📌 เลขรายการ <span class="text-muted fw-normal">(ID อ้างอิงจากระบบหลัก)</span></label>
                <input type="text" id="reqIdInput" class="form-control form-control-lg bg-light text-danger fw-bold" readonly placeholder="ระบบจะสร้างให้อัตโนมัติหากไม่มีการระบุมา">
            </div>

            <div class="mb-4">
                <label class="form-label">👤 เลือกผู้ขอเบิกยืม <span class="text-muted fw-normal">(พิมพ์ชื่อค้นหาได้)</span></label>
                <select id="userNameSelect" class="form-select form-select-lg" required>
                    <option value="">กำลังโหลดรายชื่อ... ⏳</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="form-label d-flex justify-content-between align-items-end mb-3">
                    <span>📱 เลือกเครื่องที่ว่าง <span class="text-muted fw-normal">(กดเลือกได้หลายเครื่อง)</span></span>
                    <span class="badge bg-secondary fs-6" id="selectedCount">เลือกแล้ว 0 เครื่อง</span>
                </label>
                
                <div class="category-header" data-bs-toggle="collapse" data-bs-target="#collapseNormal" aria-expanded="true">
                    🔹 หมวด iPad (ปกติ)
                </div>
                <div class="collapse show" id="collapseNormal">
                    <div id="ipadNormalContainer" class="ipad-container grid-layout">
                        <div class="grid-full-width text-muted py-2">กำลังโหลด... ⏳</div>
                    </div>
                </div>

                <div class="category-header collapsed" data-bs-toggle="collapse" data-bs-target="#collapseAir" aria-expanded="false">
                    🔹 หมวด iPad Air + APC
                </div>
                <div class="collapse" id="collapseAir">
                    <div id="ipadAirContainer" class="ipad-container grid-layout">
                        <div class="grid-full-width text-muted py-2">กำลังโหลด... ⏳</div>
                    </div>
                </div>
            </div>

            <div id="dynamicChecklistContainer" class="mb-4 d-none">
                <label class="form-label text-dark fw-bold mb-3">✅ สิ่งที่แอดมินต้องเตรียม <span class="text-muted fw-normal">(เช็คให้ครบทุกเครื่อง)</span></label>
                <div class="table-responsive bg-white">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th class="text-start ps-4">รหัส iPad</th>
                                <th>G-Drive</th>
                                <th>ไฟล์เอกสาร</th>
                                <th>ไฟล์รูปภาพ</th>
                                <th>Safari</th>
                                <th>ปุ่มลัด</th>
                            </tr>
                        </thead>
                        <tbody id="dynamicChecklistBody">
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="mb-4 p-4 rounded-4" style="background-color: #fff5f5; border: 1px dashed #fca5a5;">
                <div class="form-check form-switch d-flex align-items-center gap-3">
                    <input class="form-check-input m-0" type="checkbox" id="emergencyCheck" style="width: 45px !important; height: 24px !important; cursor: pointer;" onchange="toggleEmergencyNote()">
                    <label class="form-check-label fw-bold text-danger m-0" for="emergencyCheck" style="font-size: 1.1rem; cursor: pointer;">🚨 กรณีเบิกยืมฉุกเฉิน</label>
                </div>
                
                <div id="emergencyNoteContainer" class="mt-3" style="display: none;">
                    <label class="form-label text-danger fw-bold fs-6 mb-2">ระบุเหตุผลการยืมฉุกเฉิน <span class="text-muted fw-normal" style="font-size: 0.85rem;">(บังคับกรอก)</span></label>
                    <input type="text" id="emergencyNote" class="form-control border-danger" placeholder="เช่น เครื่องเดิมชำรุดกะทันหัน, อาจารย์ขอเพิ่มด่วน...">
                </div>
            </div>

            <button type="button" class="btn btn-submit-custom shadow-sm" id="submitBtn" onclick="submitStep1()">ยืนยันการเตรียมเครื่อง</button>
        </form>
    </div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script src="script.js"></script>

<script>
    let maxLimit = 0;

    window.onload = function() {
        if(localStorage.getItem("userRole") !== "Admin") { 
            Swal.fire("ปฏิเสธการเข้าถึง", "เฉพาะแอดมินเท่านั้น", "error").then(() => window.location.href="index.html"); 
            return; 
        }

        const urlParams = new URLSearchParams(window.location.search);
        const urlReqId = urlParams.get('id') || "";
        const extAmount = parseInt(urlParams.get('amount'), 10) || 0;

        if (urlReqId !== "") {
            let formattedReqId = urlReqId;
            if (!formattedReqId.toUpperCase().startsWith("REQ-")) {
                formattedReqId = "REQ-" + formattedReqId;
            }
            document.getElementById('reqIdInput').value = formattedReqId;
        }

        if (extAmount > 0) {
            maxLimit = extAmount;
            document.getElementById('selectedCount').innerText = `เลือกแล้ว 0/${maxLimit} เครื่อง`;
        }

        loadUsersAndIpads();
    };

    // 🚀 รวบตึง! โหลดรายชื่อผู้ใช้งานและ iPad ที่ว่างมาพร้อมกันใน 1 วินาที (ลดเวลาเชื่อมต่อ Google)
    async function loadUsersAndIpads() {
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: "getStep1InitData" })
            });
            const res = await response.json();

            const select = document.getElementById("userNameSelect");
            select.innerHTML = '<option value="">-- เลือกชื่อผู้ขอยืม --</option>';

            const containerNormal = document.getElementById("ipadNormalContainer");
            const containerAir = document.getElementById("ipadAirContainer");
            containerNormal.innerHTML = ""; containerAir.innerHTML = "";

            if (res.status === "success") {
                // 📌 1. ยัดข้อมูลรายชื่อเข้าช่อง Select2
                if (res.users && res.users.length > 0) {
                    res.users.sort((a, b) => a.localeCompare(b, 'th'));
                    res.users.forEach(name => { select.innerHTML += `<option value="${name}">${name}</option>`; });
                    
                    $('#userNameSelect').select2({
                        theme: "bootstrap-5",
                        width: '100%',
                        placeholder: "-- เลือกชื่อผู้ขอยืม --",
                        allowClear: true
                    });

                    const urlBorrower = new URLSearchParams(window.location.search).get('borrower') || "";
                    if (urlBorrower !== "") {
                        for(let i = 0; i < select.options.length; i++) {
                            if(select.options[i].text.includes(urlBorrower)) {
                                $('#userNameSelect').val(select.options[i].value).trigger('change');
                                break;
                            }
                        }
                    }
                } else {
                    select.innerHTML = '<option value="">❌ ไม่พบรายชื่อผู้ใช้งาน</option>';
                }

                // 📌 2. ยัดข้อมูลรหัสเครื่องลงตะกร้า
                if (res.inventory && res.inventory.length > 0) {
                    res.inventory.sort((a, b) => {
                        let numA = parseInt(a.replace(/\D/g, ''), 10) || 0;
                        let numB = parseInt(b.replace(/\D/g, ''), 10) || 0;
                        return numA - numB;
                    });

                    let countNormal = 0, countAir = 0;

                    res.inventory.forEach(id => { 
                        const safeId = id.replace(/[^a-zA-Z0-9]/g, '');
                        const btnHtml = `
                            <input type="checkbox" class="btn-check ipad-checkbox" id="btn-${safeId}" value="${id}" data-safeid="${safeId}" onchange="handleIpadSelection(this)">
                            <label class="btn btn-outline-red shadow-sm" for="btn-${safeId}" title="${id}">${id}</label>
                        `;
                        
                        if (id.includes("Air") || id.includes("APC")) { containerAir.innerHTML += btnHtml; countAir++; } 
                        else { containerNormal.innerHTML += btnHtml; countNormal++; }
                    });

                    if(countNormal === 0) containerNormal.innerHTML = '<div class="grid-full-width text-muted">-- ไม่มีเครื่องว่าง --</div>';
                    if(countAir === 0) containerAir.innerHTML = '<div class="grid-full-width text-muted">-- ไม่มีเครื่องว่าง --</div>';
                } else { 
                    containerNormal.innerHTML = '<div class="grid-full-width text-danger fw-bold">❌ ไม่มีเครื่องว่าง</div>'; 
                    containerAir.innerHTML = '<div class="grid-full-width text-danger fw-bold">❌ ไม่มีเครื่องว่าง</div>'; 
                }

            } else {
                throw new Error("เซิร์ฟเวอร์ตอบกลับผิดพลาด");
            }

        } catch (error) {
            console.error("Error loading setup data:", error);
            document.getElementById("userNameSelect").innerHTML = '<option value="">❌ โหลดข้อมูลล้มเหลว</option>';
            document.getElementById("ipadNormalContainer").innerHTML = '<div class="grid-full-width text-danger fw-bold">❌ เกิดข้อผิดพลาดในการดึงข้อมูล</div>';
            document.getElementById("ipadAirContainer").innerHTML = '<div class="grid-full-width text-danger fw-bold">❌ เกิดข้อผิดพลาดในการดึงข้อมูล</div>';
        }
    }

    function handleIpadSelection(checkbox) {
        const currentSelectedCount = document.querySelectorAll('.ipad-checkbox:checked').length;

        if (checkbox.checked && maxLimit > 0 && currentSelectedCount > maxLimit) {
            checkbox.checked = false; 
            Swal.fire("เต็มโควต้า!", `รายการนี้ระบุจำนวนการยืมไว้สูงสุดที่ ${maxLimit} เครื่องครับ`, "warning");
            return;
        }

        const ipadId = checkbox.value; 
        const safeId = checkbox.dataset.safeid; 
        const tbody = document.getElementById("dynamicChecklistBody");
        const container = document.getElementById("dynamicChecklistContainer");
        
        if (checkbox.checked) {
            const tr = document.createElement("tr");
            tr.id = `row-${safeId}`;
            const numericValue = parseInt(ipadId.replace(/\D/g, ''), 10) || 0;
            tr.dataset.sortval = numericValue;
            tr.dataset.rawname = ipadId;

            tr.innerHTML = `
                <td data-label="รหัส iPad" class="text-start ps-4">
                    <div class="fw-bold text-dark fs-6 m-0">${ipadId}</div>
                </td>
                <td data-label="G-Drive"><input type="checkbox" class="form-check-input check-${safeId}" value="drive"></td>
                <td data-label="ไฟล์เอกสาร"><input type="checkbox" class="form-check-input check-${safeId}" value="file"></td>
                <td data-label="ไฟล์รูปภาพ"><input type="checkbox" class="form-check-input check-${safeId}" value="img"></td>
                <td data-label="Safari"><input type="checkbox" class="form-check-input check-${safeId}" value="safari"></td>
                <td data-label="ปุ่มลัด"><button type="button" class="btn btn-shortcut btn-sm fw-bold px-3 w-100" onclick="tickAllRow('${safeId}')">ติ๊กครบ</button></td>
            `;
            tbody.appendChild(tr);
        } else {
            const tr = document.getElementById(`row-${safeId}`);
            if (tr) tr.remove();
        }

        const rows = Array.from(tbody.querySelectorAll('tr'));
        rows.sort((a, b) => {
            const valA = parseInt(a.dataset.sortval, 10);
            const valB = parseInt(b.dataset.sortval, 10);
            if (valA === valB) return a.dataset.rawname.localeCompare(b.dataset.rawname);
            return valA - valB;
        });
        rows.forEach(row => tbody.appendChild(row));

        const count = rows.length;
        const badge = document.getElementById('selectedCount');
        
        if (maxLimit > 0) {
            badge.innerText = `เลือกแล้ว ${count}/${maxLimit} เครื่อง`;
            if (count === maxLimit) {
                badge.className = "badge bg-success fs-6"; 
            } else if (count > 0) {
                badge.className = "badge bg-danger fs-6";
            } else {
                badge.className = "badge bg-secondary fs-6";
            }
        } else {
            badge.innerText = `เลือกแล้ว ${count} เครื่อง`;
            badge.className = count > 0 ? "badge bg-danger fs-6" : "badge bg-secondary fs-6";
        }
        
        if (count > 0) container.classList.remove('d-none');
        else container.classList.add('d-none');
    }

    function tickAllRow(safeId) {
        const checkboxes = document.querySelectorAll(`.check-${safeId}`);
        checkboxes.forEach(cb => cb.checked = true);
    }

    function toggleEmergencyNote() {
        const isChecked = document.getElementById("emergencyCheck").checked;
        const noteContainer = document.getElementById("emergencyNoteContainer");
        const noteInput = document.getElementById("emergencyNote");

        if (isChecked) {
            noteContainer.style.display = "block";
            noteInput.focus();
        } else {
            noteContainer.style.display = "none";
            noteInput.value = ""; 
        }
    }

    async function submitStep1() {
        const reqIdValue = document.getElementById("reqIdInput").value.trim(); 
        const recipientName = document.getElementById("userNameSelect").value;
        const adminName = localStorage.getItem("userName") || "Admin";
        const selectedIpads = document.querySelectorAll('.ipad-checkbox:checked');
        const isEmergency = document.getElementById("emergencyCheck").checked;
        const emergencyNote = document.getElementById("emergencyNote").value.trim();

        if(!recipientName) return Swal.fire("แจ้งเตือน", "กรุณาเลือกชื่อผู้ขอยืม", "warning");
        if(selectedIpads.length === 0) return Swal.fire("แจ้งเตือน", "กรุณากดเลือก iPad อย่างน้อย 1 เครื่อง", "warning");
        if(isEmergency && !emergencyNote) return Swal.fire("แจ้งเตือน", "กรุณาระบุเหตุผลการยืมฉุกเฉินด้วยครับ", "warning");
        
        let allChecked = true;
        const ipadData = [];

        selectedIpads.forEach(checkbox => {
            const id = checkbox.value;
            const safeId = checkbox.dataset.safeid;
            const checks = document.querySelectorAll(`.check-${safeId}`);
            if (checks.length > 0) {
                const drive = checks[0].checked;
                const file = checks[1].checked;
                const img = checks[2].checked;
                const safari = checks[3].checked;
                if (!drive || !file || !img || !safari) allChecked = false;
                ipadData.push({ id: id, drive: drive, file: file, img: img, safari: safari });
            }
        });

        if(!allChecked) return Swal.fire("แจ้งเตือน", "กรุณาติ๊กเตรียมเครื่องให้ครบทุกข้อ ของทุกเครื่องที่เลือกครับ", "warning");

        const btn = document.getElementById("submitBtn");
        btn.innerHTML = "กำลังบันทึกข้อมูล... ⏳";
        btn.disabled = true;

        let finalNote = `เตรียมให้: ${recipientName} (${selectedIpads.length} เครื่อง)`;
        if(isEmergency) {
            finalNote = `🚨 [ยืมฉุกเฉิน] เหตุผล: ${emergencyNote}`;
        }

        const payload = { 
            action: "saveStep1", 
            reqId: reqIdValue !== "" ? reqIdValue : null, 
            adminName: adminName, 
            recipientName: recipientName, 
            note: finalNote, 
            ipadData: ipadData 
        };

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            
            const rawText = await response.text(); 
            let res;
            
            try {
                res = JSON.parse(rawText);
            } catch (parseErr) {
                if (navigator.onLine) {
                    Swal.fire({
                        title: "บันทึกสำเร็จ!",
                        html: `ข้อมูลได้ถูกบันทึกลงระบบเรียบร้อยแล้ว<br><span style="font-size: 0.85rem; color: gray;">(เซิร์ฟเวอร์ตอบกลับล่าช้าเล็กน้อย แต่ข้อมูลปลอดภัย 100%)</span>`,
                        icon: "success",
                        confirmButtonColor: "#dc3545",
                        allowOutsideClick: false
                    }).then(() => {
                        window.location.href = "admin.html";
                    });
                    return;
                }
            }

            if(res.status === "success") {
                Swal.fire({
                    title: "บันทึกสำเร็จ!",
                    html: `หมายเลขรายการ : <b>${res.reqId || "-"}</b><br>ระบบบันทึกสถานะ : รอยืนยันแล้ว`,
                    icon: "success",
                    confirmButtonColor: "#dc3545",
                    confirmButtonText: "กลับเมนูหลัก",
                    allowOutsideClick: false
                }).then(() => {
                    window.location.href = "admin.html";
                });
            } else {
                Swal.fire("ข้อผิดพลาด", res.message || "เกิดข้อผิดพลาดในการบันทึก", "error");
                btn.innerHTML = "ยืนยันการเตรียมเครื่อง"; btn.disabled = false;
            }

        } catch (err) {
            if (navigator.onLine) {
                Swal.fire({
                    title: "บันทึกสำเร็จ!",
                    html: `อัปเดตข้อมูลลงฐานข้อมูลเรียบร้อยแล้ว<br><span style="font-size: 0.85rem; color: gray;">(ระบบเชื่อมต่อล่าช้า แต่บันทึกสำเร็จแน่นอน)</span>`,
                    icon: "success",
                    confirmButtonColor: "#dc3545",
                    allowOutsideClick: false
                }).then(() => {
                    window.location.href = "admin.html";
                });
            } else {
                Swal.fire("ขัดข้อง", "ไม่สามารถเชื่อมต่ออินเทอร์เน็ตได้", "error");
                btn.innerHTML = "ยืนยันการเตรียมเครื่อง"; btn.disabled = false;
            }
        }
    }
</script>
</body>
</html>
