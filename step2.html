<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 2 | รับเครื่อง</title>
	<link rel="icon" href="https://github.com/trainingbudc-png/Nattha/blob/main/%E0%B8%A3%E0%B8%B9%E0%B8%9B.png?raw=true" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme-user.css">
    <style>
        body { background: #f8f9fa; font-family: 'Kanit', sans-serif; padding: 20px; }
        .confirm-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); max-width: 950px; margin: auto; border: 1px solid #e2e8f0; }
        
        /* 📌 Info Box (มาตรฐานเดียวกันทุกหน้า) */
        .info-box { background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; margin-bottom: 25px; display: flex; justify-content: space-around; align-items: center; }
        .info-label { font-size: 0.85rem; color: #64748b; font-weight: 600; text-transform: uppercase; margin-bottom: 4px; }
        .info-value { font-size: 1.15rem; font-weight: bold; color: #1e293b; }
        .divider { width: 1px; background-color: #e2e8f0; height: 50px; }

        /* 💻 สไตล์ตารางสำหรับจอคอม (Desktop) */
        .table-responsive { border-radius: 12px; border: 1px solid #e2e8f0; overflow: hidden; }
        .table { margin-bottom: 0; }
        .table th { background-color: #f8fafc; color: #475569; font-weight: 600; text-align: center; padding: 15px; border-bottom: 2px solid #e2e8f0; font-size: 0.95rem; white-space: nowrap; }
        .table td { vertical-align: middle; text-align: center; padding: 12px 15px; border-bottom: 1px solid #f1f5f9; color: #1e293b; font-weight: 500; font-size: 0.95rem; }
        .table tbody tr:hover { background-color: #fcfcfc; }
        
        /* 📌 ปุ่ม Checkbox และปุ่มยืนยัน */
        .check-app:disabled { cursor: not-allowed; opacity: 0.4; }
        .check-app, .select-ipad { width: 24px !important; height: 24px !important; cursor: pointer; accent-color: #212529; }
        .btn-confirm { background: #212529; color: white; border-radius: 12px; padding: 15px; font-weight: bold; width: 100%; margin-top: 25px; transition: 0.3s; border: none; font-size: 1.1rem; }
        .btn-confirm:hover { background: #495057; color: white; }

        /* 📱 ปรับการ์ดบนหน้าจอมือถือ (Mobile) */
        @media (max-width: 768px) {
            .info-box { flex-direction: column; text-align: center; gap: 15px; }
            .divider { width: 50px; height: 1px; }
            .table-responsive { border: none; }
            .table thead { display: none; }
            .table tbody tr { display: block; background: #ffffff; border-radius: 16px; margin-bottom: 16px; padding: 16px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); border: 1px solid #e2e8f0; }
            .table tbody td { display: flex; justify-content: space-between; align-items: center; text-align: right; padding: 12px 0; border-bottom: 1px solid #f1f5f9; }
            .table tbody td::before { content: attr(data-label); font-weight: 500; color: #64748b; font-size: 0.95rem; text-align: left; margin-right: 15px; }
            
            /* แยกเส้นแบ่งระหว่าง หัวข้อการ์ด กับ เช็คลิสต์ ให้ชัดเจน */
            .table tbody td:first-child { border-bottom: 2px solid #e2e8f0 !important; padding-bottom: 16px; margin-bottom: 8px; }
            .table tbody td:last-child { border-bottom: none !important; padding-bottom: 0; padding-top: 16px; display: block; }
            .table tbody td:last-child::before { display: none; } 
            .table tbody td:last-child .btn { padding: 12px !important; font-size: 1.05rem; }
        }
    </style>
</head>
<body>
<div class="confirm-card">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold text-dark mb-0">✅ Step 2 | รับเครื่อง</h4>
        <a href="step2-list.html" class="btn btn-outline-dark px-3 fw-bold rounded-pill btn-sm border-2">🔙 กลับ</a>
    </div>
    
    <div class="info-box">
        <div class="text-center">
            <div class="info-label">👤 ผู้ขอเบิกยืม</div>
            <div id="displayUserName" class="info-value">กำลังโหลด...</div>
        </div>
        <div class="divider"></div>
        <div class="text-center">
            <div class="info-label">👨‍💻 แอดมินผู้เตรียม</div>
            <div id="displayAdminName" class="info-value">กำลังโหลด...</div>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table align-middle">
            <thead>
                <tr>
                    <th class="text-start ps-4">เลือกรับเครื่อง</th>
                    <th>Drive</th>
                    <th>File</th>
                    <th>Img</th>
                    <th>Safari</th>
                    <th>ปุ่มลัด</th>
                </tr>
            </thead>
            <tbody id="itemList">
                <tr><td colspan="6" class="text-muted py-4 text-center">กำลังโหลดข้อมูล... ⏳</td></tr>
            </tbody>
        </table>
    </div>
    
    <button id="btnSubmit" class="btn btn-confirm shadow-sm" onclick="submitReceipt()">ยืนยันการรับเครื่อง</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwv7qtsMDLxaXD3RbGB8Q0Nq1U0Q91cRL7rhe0Ge4OWEC41cvtajsI-JlFwjPmRrPCu/exec";
    const reqId = new URLSearchParams(window.location.search).get('reqId');
    const currentLoggerName = localStorage.getItem("userName") || "ผู้ใช้งาน";

    fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getStep1Data", reqId: reqId }) })
    .then(res => res.json())
    .then(res => {
        document.getElementById('displayUserName').innerText = res.userName || "ไม่ระบุ";
        document.getElementById('displayAdminName').innerText = res.adminName || "ไม่ระบุ";

        const tbody = document.getElementById('itemList');
        tbody.innerHTML = ""; 

        if(res.data && res.data.length > 0) {
            res.data.forEach(item => {
                tbody.innerHTML += `<tr data-ipad="${item.ipadId}">
                    <td data-label="เลือกรับเครื่อง" class="text-start ps-4">
                        <div class="d-flex align-items-center">
                            <input type="checkbox" class="select-ipad form-check-input me-3" id="btn-${item.ipadId}" onchange="toggleRow(this)"> 
                            <label for="btn-${item.ipadId}" style="cursor:pointer;" class="fw-bold fs-6 m-0">${item.ipadId}</label>
                        </div>
                    </td>
                    <td data-label="Drive"><input type="checkbox" class="check-app form-check-input" disabled></td>
                    <td data-label="File"><input type="checkbox" class="check-app form-check-input" disabled></td>
                    <td data-label="Img"><input type="checkbox" class="check-app form-check-input" disabled></td>
                    <td data-label="Safari"><input type="checkbox" class="check-app form-check-input" disabled></td>
                    <td data-label="ปุ่มลัด"><button type="button" class="btn btn-dark btn-sm fw-bold w-100 rounded-pill" onclick="tickAll(this)">ติ๊กครบ</button></td>
                </tr>`;
            });
        } else {
            tbody.innerHTML = '<tr><td colspan="6" class="text-danger fw-bold py-4 text-center">❌ ไม่พบรายการเครื่อง</td></tr>';
        }
    });

    function toggleRow(checkbox) {
        const row = checkbox.closest('tr');
        row.querySelectorAll('.check-app').forEach(app => {
            app.disabled = !checkbox.checked;
            if (!checkbox.checked) app.checked = false;
        });
    }

    function tickAll(btn) {
        const row = btn.closest('tr');
        const mainCheck = row.querySelector('.select-ipad');
        mainCheck.checked = true; 
        row.querySelectorAll('.check-app').forEach(cb => { cb.disabled = false; cb.checked = true; });
    }

    async function submitReceipt() {
        let items = [];
        document.querySelectorAll('.select-ipad:checked').forEach(ipad => {
            const row = ipad.closest('tr');
            const checks = Array.from(row.querySelectorAll('.check-app')).map(c => c.checked ? "☑" : "☐");
            items.push({ ipadId: row.dataset.ipad, checklist: checks.join(",") });
        });

        if (items.length === 0) {
            Swal.fire({ title: "⚠️ ข้อมูลไม่ครบถ้วน", text: "กรุณาติ๊กเลือกหน้าชื่อ iPad อย่างน้อย 1 เครื่องก่อนกดยืนยันครับ!", icon: "warning", confirmButtonColor: "#212529" });
            return;
        }

        const btn = document.getElementById('btnSubmit');
        btn.innerText = "กำลังบันทึกข้อมูล... ⏳"; btn.disabled = true;

        try {
            const response = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "updateStatus", reqId: reqId, items: items, note: "", name: currentLoggerName }) });
            const result = await response.json();
            if (result.status === "success") {
                Swal.fire({
                    title: "รับเครื่องเรียบร้อย!",
                    html: `หมายเลขรายการ : <b>${reqId}</b><br>ระบบบันทึกการรับเครื่องจำนวน : ${items.length} เครื่อง`,
                    icon: "success",
                    confirmButtonColor: "#212529",
                    confirmButtonText: "OK",
                    allowOutsideClick: false
                }).then(() => {
                    const userRole = localStorage.getItem("userRole");
                    window.location.href = userRole === "Admin" ? "admin.html" : "user.html";
                });
            } else { 
                Swal.fire("❌ เกิดข้อผิดพลาด", result.message || "ในการบันทึกข้อมูล", "error"); 
                btn.innerText = "💾 ยืนยันการรับเครื่อง"; btn.disabled = false; 
            }
        } catch (error) {
            Swal.fire("❌ เกิดข้อผิดพลาด", "ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้", "error"); 
            btn.innerText = "💾 ยืนยันการรับเครื่อง"; btn.disabled = false;
        }
    }
</script>
</body>
</html>
