<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 2 | รับเครื่อง</title>
	<link rel="icon" href="https://github.com/trainingbudc-png/Nattha/blob/main/%E0%B8%A3%E0%B8%B9%E0%B8%9B.png?raw=true" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme-user.css">
    <style>
        body { background: #f8f9fa; font-family: 'Kanit', sans-serif; padding: 20px; }
        .confirm-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); max-width: 900px; margin: auto; border: 1px solid #e9ecef; }
        .info-box { background-color: #f8f9fa; border: 1px solid #dee2e6; border-radius: 12px; padding: 15px; margin-bottom: 25px; display: flex; justify-content: space-around; align-items: center; }
        .info-label { font-size: 0.85rem; color: #6c757d; font-weight: 600; text-transform: uppercase; margin-bottom: 4px; }
        .info-value { font-size: 1.1rem; font-weight: bold; color: #212529; }
        .divider { width: 1px; background-color: #dee2e6; height: 40px; }
        
        .btn-confirm { background: #212529; color: white; border-radius: 12px; padding: 15px; font-weight: bold; width: 100%; font-size: 1.1rem; transition: 0.3s; border: none; margin-top: 20px; }
        .btn-confirm:hover { background: #495057; color: white; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(33,37,41,0.2); }
        
        /* 📌 ดีไซน์การ์ด iPad แบบใหม่ */
        .ipad-card { transition: all 0.3s ease; border-color: #dee2e6; }
        .ipad-card.active-card { border-color: #212529 !important; box-shadow: 0 4px 15px rgba(0,0,0,0.08) !important; transform: translateY(-2px); }
        
        /* 📌 ปรับสีและขนาด Checkbox ให้เหมือนในรูปเป๊ะๆ */
        .select-ipad { width: 26px !important; height: 26px !important; cursor: pointer; accent-color: #0d6efd; transition: transform 0.2s; }
        .select-ipad:active { transform: scale(0.9); }
        
        .check-item { width: 22px !important; height: 22px !important; cursor: pointer; accent-color: #0d6efd; }

        @media screen and (max-width: 768px) {
            .confirm-card { padding: 20px; }
            .info-box { flex-direction: column; gap: 15px; }
            .divider { width: 100%; height: 1px; }
        }
    </style>
</head>
<body>
<div class="confirm-card">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold text-dark mb-0">📲 Step 2 | รับเครื่อง</h4>
        <a href="step2-list.html" class="btn btn-outline-dark px-3 fw-bold rounded-pill btn-sm border-2">🔙 กลับ</a>
    </div>
    
    <div class="info-box">
        <div class="text-center">
            <div class="info-label">👤 ผู้ขอเบิกยืม</div>
            <div id="displayUserName" class="info-value">กำลังโหลด...</div>
        </div>
        <div class="divider"></div>
        <div class="text-center">
            <div class="info-label">👨‍💻 แอดมินผู้เตรียม</div>
            <div id="displayAdminName" class="info-value">กำลังโหลด...</div>
        </div>
    </div>

    <!-- 📌 คอนเทนเนอร์ใส่การ์ดแทนตารางเดิม -->
    <div id="itemList" class="d-flex flex-column gap-3 mb-4">
        <div class="text-center text-muted py-4">กำลังโหลดข้อมูล... ⏳</div>
    </div>
    
    <button id="btnSubmit" class="btn btn-confirm shadow-sm" onclick="submitReceipt()">ยืนยันการรับเครื่อง</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> <script src="script.js"></script>
<script>
    const reqId = new URLSearchParams(window.location.search).get('reqId');
    const currentLoggerName = localStorage.getItem("userName") || "ผู้ใช้งาน";
    const isAdmin = localStorage.getItem("userRole") === "Admin"; 

    fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getStep1Data", reqId: reqId }) })
    .then(res => res.json())
    .then(res => {
        if (res.reqStatus && res.reqStatus !== "Step[1]") {
            Swal.fire("แจ้งเตือน", `รายการนี้รับเครื่องไปแล้ว (สถานะ: ${res.reqStatus})`, "warning").then(() => {
                window.location.href = isAdmin ? "admin.html" : "user.html";
            });
            return;
        }

        document.getElementById('displayUserName').innerText = res.userName || "ไม่ระบุ";
        document.getElementById('displayAdminName').innerText = res.adminName || "ไม่ระบุ";

        const container = document.getElementById('itemList');
        container.innerHTML = ""; 

        if(res.data && res.data.length > 0) {
            res.data.forEach(item => {
                let adminBtn = isAdmin ? `<button type="button" class="btn btn-dark btn-sm fw-bold px-3 rounded-pill shadow-sm" onclick="tickAllInCard(this)">ติ๊กครบ</button>` : '';
                
                container.innerHTML += `
                <div class="ipad-card bg-white border border-2 rounded-4 overflow-hidden transition-all" data-ipad="${item.ipadId}">
                    <!-- แถบหัวข้อสีเทาอ่อน -->
                    <div class="bg-light border-bottom px-4 py-3 d-flex justify-content-between align-items-center">
                        <div class="d-flex align-items-center gap-3">
                            <input type="checkbox" class="select-ipad form-check-input m-0 shadow-sm" id="btn-${item.ipadId}" data-target="collapse-${item.ipadId}" onchange="toggleCard(this)"> 
                            <label for="btn-${item.ipadId}" style="cursor:pointer;" class="text-dark fw-bold fs-5 mb-0">${item.ipadId}</label>
                        </div>
                        ${adminBtn}
                    </div>
                    
                    <!-- 📌 เปลี่ยนเป็นระบบ Grid ล็อกความกว้าง -->
                    <div class="collapse" id="collapse-${item.ipadId}">
                        <div class="p-4 row row-cols-2 row-cols-sm-4 g-4 text-center">
                            <div class="col">
                                <label class="d-flex flex-column align-items-center gap-2 mb-0 w-100" style="cursor: pointer;">
                                    <span class="fw-bold text-dark text-truncate w-100" style="font-size: 0.9rem;">Drive</span>
                                    <input type="checkbox" class="check-item form-check-input m-0 shadow-sm flex-shrink-0">
                                </label>
                            </div>
                            <div class="col">
                                <label class="d-flex flex-column align-items-center gap-2 mb-0 w-100" style="cursor: pointer;">
                                    <span class="fw-bold text-dark text-truncate w-100" style="font-size: 0.9rem;">File</span>
                                    <input type="checkbox" class="check-item form-check-input m-0 shadow-sm flex-shrink-0">
                                </label>
                            </div>
                            <div class="col">
                                <label class="d-flex flex-column align-items-center gap-2 mb-0 w-100" style="cursor: pointer;">
                                    <span class="fw-bold text-dark text-truncate w-100" style="font-size: 0.9rem;">Img</span>
                                    <input type="checkbox" class="check-item form-check-input m-0 shadow-sm flex-shrink-0">
                                </label>
                            </div>
                            <div class="col">
                                <label class="d-flex flex-column align-items-center gap-2 mb-0 w-100" style="cursor: pointer;">
                                    <span class="fw-bold text-dark text-truncate w-100" style="font-size: 0.9rem;">Safari</span>
                                    <input type="checkbox" class="check-item form-check-input m-0 shadow-sm flex-shrink-0">
                                </label>
                            </div>
                        </div>
                    </div>
                </div>`;
            });
        } else {
            container.innerHTML = `<div class="text-center text-danger py-4">❌ ไม่พบรายการเครื่อง</div>`;
        }
    });

    // 📌 ฟังก์ชันจัดการเปิด-ปิดการ์ด
    function toggleCard(checkbox) {
        const targetId = checkbox.dataset.target;
        const collapseElement = document.getElementById(targetId);
        const bsCollapse = bootstrap.Collapse.getOrCreateInstance(collapseElement, { toggle: false });
        const card = checkbox.closest('.ipad-card');
        
        if (checkbox.checked) {
            bsCollapse.show();
            card.classList.add('active-card');
        } else {
            bsCollapse.hide();
            card.classList.remove('active-card');
            collapseElement.querySelectorAll('.check-item').forEach(cb => cb.checked = false); // เคลียร์ติ๊กย่อย
        }
    }

    // 📌 ฟังก์ชันติ๊กครบสำหรับแอดมิน
    function tickAllInCard(btn) {
        const card = btn.closest('.ipad-card');
        const mainCheck = card.querySelector('.select-ipad');
        if (!mainCheck.checked) {
            mainCheck.checked = true;
            toggleCard(mainCheck);
        }
        card.querySelectorAll('.check-item').forEach(cb => cb.checked = true);
    }

    async function submitReceipt() {
        let items = [];
        let isAllChecked = true; 

        document.querySelectorAll('.select-ipad:checked').forEach(ipad => {
            const card = ipad.closest('.ipad-card');
            const checks = Array.from(card.querySelectorAll('.check-item'));
            
            if (checks.some(c => !c.checked)) isAllChecked = false;

            const checkValues = checks.map(c => c.checked ? "☑" : "☐");
            items.push({ ipadId: card.dataset.ipad, checklist: checkValues.join(",") });
        });

        if (items.length === 0) {
            Swal.fire({ title: "⚠️ ข้อมูลไม่ครบถ้วน", text: "กรุณาติ๊กเลือกหน้าชื่อ iPad อย่างน้อย 1 เครื่องก่อนกดยืนยันครับ!", icon: "warning", confirmButtonColor: "#212529" });
            return;
        }

        if (!isAllChecked) {
            Swal.fire({ title: "⚠️ ข้อมูลไม่ครบถ้วน", text: "กรุณาตรวจสอบและติ๊กรายการให้ครบทุกข้อ สำหรับ iPad ที่เลือกครับ!", icon: "warning", confirmButtonColor: "#212529" });
            return;
        }

        const btn = document.getElementById('btnSubmit');
        btn.innerText = "กำลังบันทึกข้อมูล... ⏳"; btn.disabled = true;

        try {
            const response = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "updateStatus", reqId: reqId, items: items, note: "", name: currentLoggerName }) });
            const result = await response.json();
            if (result.status === "success") {
                Swal.fire({
                    title: "รับเครื่องเรียบร้อย!",
                    html: `หมายเลขรายการ : <b>${reqId}</b><br>ระบบบันทึกการรับเครื่องจำนวน : ${items.length} เครื่อง`,
                    icon: "success",
                    confirmButtonColor: "#212529",
                    confirmButtonText: "OK",
                    allowOutsideClick: false
                }).then(() => {
                    window.location.href = isAdmin ? "admin.html" : "user.html";
                });
            }
            else { Swal.fire("❌ เกิดข้อผิดพลาด", result.message || "ในการบันทึกข้อมูล", "error"); btn.innerText = "ยืนยันการรับเครื่อง"; btn.disabled = false; }
        } catch (error) {
            Swal.fire("❌ เกิดข้อผิดพลาด", "ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้", "error"); btn.innerText = "ยืนยันการรับเครื่อง"; btn.disabled = false;
        }
    }
</script>
</body>
</html>
