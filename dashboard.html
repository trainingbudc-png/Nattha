<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard ภาพรวมระบบ</title>
    <link rel="icon" href="https://github.com/trainingbudc-png/Nattha/blob/main/%E0%B8%A3%E0%B8%B9%E0%B8%9B.png?raw=true" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="theme-admin.css">
    
    <style>
        .dashboard-container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .table-dashboard { white-space: nowrap; border-collapse: collapse; }
        .table-dashboard td { font-size: 0.85rem; padding: 12px 10px; text-align: center; vertical-align: middle; border: 1px solid #e2e8f0; background-color: white; }
        .step-cell { color: var(--admin-main); min-width: 110px; line-height: 1.4; font-weight: 500;}
        .step-cell-empty { background-color: #f8fafc !important; } 
        
        .status-badge { padding: 5px 12px; border-radius: 6px; font-weight: bold; font-size: 0.85rem; display: inline-block; }
        .status-green { background-color: #e2e8f0; color: #475569; border: 1px solid #cbd5e1; } 
        .status-yellow { background-color: #fef9c3; color: #d97706; }
        
        .pagination .page-link { color: var(--admin-main); border-color: #e2e8f0; font-weight: 500; }
        .pagination .page-item.active .page-link { background-color: var(--admin-main); border-color: var(--admin-main); color: white; }
        .pagination .page-link:hover { background-color: #e0e7ff; color: var(--admin-main); }
    </style>
</head>
<body>

    <nav class="navbar-custom">
        <div class="fw-bold fs-5 d-flex align-items-center gap-2 text-white">
            📊 Dashboard ภาพรวมระบบ
        </div>
        <a href="admin.html" class="btn btn-light text-dark btn-sm rounded-pill fw-bold px-4 shadow-sm">🔙 กลับหน้าแอดมิน</a>
    </nav>

    <div class="dashboard-container pb-5 mt-4">
        
        <div class="d-flex justify-content-between align-items-end mb-3">
            <h5 class="fw-bold text-dark m-0">ตารางข้อมูลรายการเบิก-ยืม</h5>
            <!-- 📌 ปรับปุ่มอัปเดตข้อมูลให้เป็นสไตล์ Light ซอฟต์ๆ ไม่แย่งซีน -->
            <button class="btn btn-light text-dark btn-sm rounded-pill fw-bold px-4 shadow-sm border" onclick="fetchData()">🔄 อัปเดตข้อมูล</button>
        </div>

        <div class="filter-card p-4">
            <div class="row g-3 align-items-end">
                <div class="col-md-5 col-12">
                    <label class="form-label text-muted fw-bold mb-1" style="font-size: 0.85rem;">🔍 ค้นหา (เลขรายการ / ชื่อผู้ทำ / ผู้รับ)</label>
                    <input type="text" id="searchInput" class="form-control border-2" placeholder="พิมพ์ข้อความที่ต้องการหา..." onkeyup="applyFilters()">
                </div>
                <div class="col-md-4 col-12">
                    <label class="form-label text-muted fw-bold mb-1" style="font-size: 0.85rem;">📊 กรองตามสถานะระบบ</label>
                    <select id="statusFilter" class="form-select fw-bold border-2" onchange="applyFilters()">
                        <option value="all">โชว์ทุกสถานะ (ทั้งหมด)</option>
                        <option value="ไม่ครบ">⚠️ ค้างดำเนินการ (ไม่ครบ)</option>
                        <option value="จบขั้นตอน">✔️ เสร็จสมบูรณ์ (จบขั้นตอน)</option>
                    </select>
                </div>
                <div class="col-md-3 col-12">
                    <div class="form-check form-switch d-flex align-items-center gap-2 pb-2">
                        <input class="form-check-input" type="checkbox" id="emergencyFilter" style="width: 40px; height: 20px; cursor: pointer;" onchange="applyFilters()">
                        <label class="form-check-label fw-bold mb-0 text-danger" for="emergencyFilter" style="font-size: 1rem; cursor: pointer; padding-top: 2px;">🚨 เฉพาะเคสฉุกเฉิน</label>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="table-responsive shadow-sm border rounded bg-white mt-3">
            <table class="table table-dashboard m-0">
                <thead>
                    <tr>
                        <th style="width: 5%;">#</th>
                        <th>Step 1 | เตรียม</th>
                        <th>Step 2 | ยืม</th>
                        <th>Step 3 | ก่อนสอบ</th>
                        <th>Step 4 | คืน</th>
                        <th>Step 5 | ตรวจ</th>
                        <th style="border-left: 2px solid #e2e8f0;">สถานะรวม</th>
                        <th>ผู้เตรียมเครื่อง</th>
                        <th style="min-width: 180px;">ผู้ที่จะมารับเครื่อง</th>
                        <th style="width: 15%;">หมายเหตุ</th>
                        <th>ยืมฉุกเฉิน</th>
                    </tr>
                </thead>
                <tbody id="dashboardBody">
                    <tr><td colspan="11" class="text-center py-5 text-muted">กำลังดึงและประกอบข้อมูล... ⏳</td></tr>
                </tbody>
            </table>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-3 pagination-container">
            <span id="pageInfo" class="text-muted small fw-bold">กำลังประมวลผล...</span>
            <nav>
                <ul class="pagination pagination-sm m-0 shadow-sm" id="paginationControls">
                </ul>
            </nav>
        </div>

    </div>

<script src="script.js"></script>
<script>
    let allDashboardData = [];
    let filteredData = []; 
    let currentPage = 1;
    const itemsPerPage = 20; 

    window.onload = function() {
        if(localStorage.getItem("userRole") !== "Admin") { window.location.href = "index.html"; return; }
        fetchData();
    };

    function formatStepCell(text) {
        if (!text || text.trim() === "") return '<td class="step-cell-empty"></td>';
        let formatted = text.replace(/\\n/g, '<br>').replace(/\n/g, '<br>');
        formatted = formatted.replace(/☑/g, `<span style="color:var(--admin-main); font-size:1rem;">☑</span>`);
        return `<td class="step-cell">${formatted}</td>`;
    }

    function formatStatus(statusText) {
        if (statusText === "จบขั้นตอน") return `<span class="status-badge status-green">✔️ ${statusText}</span>`;
        return `<span class="status-badge status-yellow">⚠️ ${statusText}</span>`;
    }

    function formatEmergency(emText) {
        if (!emText || emText.trim() === "" || emText === "☐") return '<span style="color:#adb5bd; font-size:1.2rem;">☐</span>';
        return `<span style="color:var(--admin-main); font-size:1.2rem; font-weight:bold;">☑</span>`;
    }

    function fetchData() {
        const tbody = document.getElementById("dashboardBody");
        tbody.innerHTML = '<tr><td colspan="11" class="text-center py-5 text-muted">กำลังประมวลผลข้อมูล... ⏳</td></tr>';
        
        fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getDashboardData" }) })
        .then(res => res.json())
        .then(res => {
            if (res.status === "success" && res.data) {
                allDashboardData = res.data;
                applyFilters(); 
            } else {
                tbody.innerHTML = '<tr><td colspan="11" class="text-center text-muted py-5">ยังไม่มีข้อมูลรายการ</td></tr>';
            }
        });
    }

    function applyFilters() {
        const searchText = document.getElementById("searchInput").value.toLowerCase();
        const statusVal = document.getElementById("statusFilter").value;
        const emCheck = document.getElementById("emergencyFilter").checked;

        filteredData = allDashboardData.filter(item => {
            let matchSearch = true;
            if (searchText !== "") {
                const reqMatch = item.reqId ? item.reqId.toLowerCase().includes(searchText) : false;
                const prepMatch = item.preparer ? item.preparer.toLowerCase().includes(searchText) : false;
                const recMatch = item.receiver ? item.receiver.toLowerCase().includes(searchText) : false;
                matchSearch = reqMatch || prepMatch || recMatch;
            }

            let matchStatus = true;
            if (statusVal !== "all") matchStatus = item.status && item.status.includes(statusVal);
            let matchEm = true;
            if (emCheck) matchEm = item.emergency === "☑";

            return matchSearch && matchStatus && matchEm;
        });
        currentPage = 1;
        renderTable();
    }

    function renderTable() {
        const tbody = document.getElementById("dashboardBody");
        tbody.innerHTML = "";

        if (filteredData.length === 0) {
            tbody.innerHTML = '<tr><td colspan="11" class="text-center text-danger fw-bold py-5">❌ ไม่พบรายการที่ตรงกับเงื่อนไข</td></tr>';
            document.getElementById("paginationControls").innerHTML = "";
            return;
        }

        const totalPages = Math.ceil(filteredData.length / itemsPerPage);
        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = Math.min(startIndex + itemsPerPage, filteredData.length);
        const pageData = filteredData.slice(startIndex, endIndex);

        pageData.forEach(item => {
            tbody.innerHTML += `
                <tr>
                    <td class="fw-bold text-dark fs-6 bg-light">${item.reqId.replace("REQ-", "")}</td>
                    ${formatStepCell(item.step1)}
                    ${formatStepCell(item.step2)}
                    ${formatStepCell(item.step3)}
                    ${formatStepCell(item.step4)}
                    ${formatStepCell(item.step5)}
                    <td style="border-left: 2px solid #e2e8f0;">${formatStatus(item.status)}</td>
                    <td class="fw-bold text-dark">${item.preparer || "-"}</td>
                    <td class="fw-bold text-dark text-start ps-3" style="white-space: normal; word-break: break-word;">${item.receiver || "-"}</td>
                    <td class="text-start text-secondary" style="font-weight: 500; white-space: normal; word-break: break-word;">${item.note || ""}</td>
                    <td>${formatEmergency(item.emergency)}</td>
                </tr>
            `;
        });

        document.getElementById("pageInfo").innerHTML = `แสดงรายการ <span class="fw-bold text-danger">${startIndex + 1}</span> ถึง <span class="fw-bold text-danger">${endIndex}</span> จากทั้งหมด <span class="fw-bold text-danger">${filteredData.length}</span> รายการ`;
        renderPaginationControls(totalPages);
    }

    function renderPaginationControls(totalPages) {
        const paginationEl = document.getElementById("paginationControls");
        let html = '';
        html += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}"><a class="page-link" href="javascript:void(0)" onclick="changePage(${currentPage - 1})">«</a></li>`;
        let startPage = Math.max(1, currentPage - 2);
        let endPage = Math.min(totalPages, currentPage + 2);
        for (let i = startPage; i <= endPage; i++) {
            html += `<li class="page-item ${currentPage === i ? 'active' : ''}"><a class="page-link" href="javascript:void(0)" onclick="changePage(${i})">${i}</a></li>`;
        }
        html += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}"><a class="page-link" href="javascript:void(0)" onclick="changePage(${currentPage + 1})">»</a></li>`;
        paginationEl.innerHTML = html;
    }

    function changePage(page) {
        const totalPages = Math.ceil(filteredData.length / itemsPerPage);
        if (page < 1 || page > totalPages) return;
        currentPage = page; renderTable();
    }
</script>
</body>
</html>
