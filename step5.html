<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 5 | ตรวจสอบรับคืนเครื่อง</title>
    <link rel="icon" href="https://github.com/trainingbudc-png/Nattha/blob/main/%E0%B8%A3%E0%B8%B9%E0%B8%9B.png?raw=true" type="image/png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="theme-admin.css">
    
    <style>
        body { background: var(--admin-bg); font-family: 'Kanit', sans-serif; padding: 20px; }
        
        .confirm-card { 
            background: white; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(30, 58, 138, 0.08); 
            max-width: 850px; 
            margin: auto; 
            border: 1px solid var(--admin-border); 
            overflow: hidden;
        }

        /* 📌 ส่วนหัวของ Card (สี Navy) */
        .card-header-navy {
            background-color: var(--admin-main);
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 📌 ป้าย REQ- ขวาบน บังคับสีตัวหนังสือให้เห็นชัด! */
        .badge-req {
            background-color: white !important;
            color: var(--admin-main) !important;
            border: 1px solid #cbd5e1;
            font-size: 0.95rem;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 50rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* 📌 ขอบ Checkbox ชัดเจน เล็งง่าย */
        .form-check-input { 
            width: 24px !important; 
            height: 24px !important; 
            cursor: pointer; 
            accent-color: var(--admin-main); 
            border: 2px solid #94a3b8 !important; 
            transition: all 0.2s;
        }
        .form-check-input:checked {
            border-color: var(--admin-main) !important;
            background-color: var(--admin-main) !important;
        }

        /* 📌 ปุ่มติ๊กครบ (ทรง Pill) */
        .btn-shortcut { 
            background: white; 
            color: var(--admin-main); 
            border: 2px solid var(--admin-main); 
            font-size: 0.85rem; 
            font-weight: 600;
            transition: 0.2s;
        }
        .btn-shortcut:hover { 
            background: var(--admin-main); 
            color: white; 
        }

        /* 📌 ปุ่มยืนยันด้านล่าง */
        .btn-admin-solid {
            background-color: var(--admin-main);
            color: white;
            border: none;
            transition: 0.3s;
        }
        .btn-admin-solid:hover {
            background-color: var(--admin-hover);
            color: white;
            box-shadow: 0 6px 15px rgba(30, 58, 138, 0.4);
        }
    </style>
</head>
<body>
    
    <div class="container pb-5">
        <div class="text-start" style="max-width: 850px; margin: 0 auto 15px auto;">
            <button class="btn btn-outline-secondary bg-white shadow-sm fw-bold rounded-pill px-4" onclick="window.location.href='step5-list.html'">🔙 กลับไปหน้ารายการ</button>
        </div>

        <div class="confirm-card">
            <!-- 📌 Header สี Navy -->
            <div class="card-header-navy">
                <h5 class="m-0 fw-bold">📱 iPad ที่ส่งคืน</h5>
                <div class="badge-req">รายการ: <span id="reqIdDisplay">กำลังโหลด...</span></div>
            </div>
            
            <div class="p-4 p-md-5">
                <!-- 📌 ส่วนแสดงชื่อผู้เบิก และ แอดมิน -->
                <div class="row text-center mb-4 pb-4 border-bottom">
                    <div class="col-6 border-end">
                        <div class="text-muted small fw-bold mb-1">👤 ผู้ขอเบิกยืม</div>
                        <div class="fw-bold fs-5" style="color: var(--admin-main);" id="borrowerNameDisplay">-</div>
                    </div>
                    <div class="col-6">
                        <div class="text-muted small fw-bold mb-1">👮 แอดมินผู้เตรียม</div>
                        <div class="fw-bold fs-5" style="color: var(--admin-main);" id="adminNameDisplay">-</div>
                    </div>
                </div>

                <!-- 📌 พื้นที่โหลดกล่อง iPad -->
                <div id="ipadListContainer">
                    <div class="text-center py-5 text-muted fw-bold">กำลังเชื่อมต่อข้อมูล... ⏳</div>
                </div>

                <!-- 📌 ปุ่มยืนยัน -->
                <button type="button" class="btn btn-admin-solid w-100 py-3 mt-4 fw-bold fs-5 rounded-3 shadow-sm" id="btnSubmit" onclick="submitStep5()">ยืนยันการตรวจสอบเครื่องเสร็จสมบูรณ์</button>
            </div>
        </div>
    </div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="script.js"></script>

<script>
    window.onload = function() {
        if(localStorage.getItem("userRole") !== "Admin") { 
            window.location.href="index.html"; 
            return; 
        }
        loadStep5Data();
    };

    // 📌 ดึงข้อมูลจากฐานข้อมูลมาแสดงผล (พร้อม Auto-Retry สู้ Google)
    async function loadStep5Data(retryCount = 3) {
        const urlParams = new URLSearchParams(window.location.search);
        const reqId = urlParams.get('reqId');
        
        if(!reqId) {
            Swal.fire("ข้อผิดพลาด", "ไม่พบหมายเลขรายการ", "error").then(() => window.location.href="step5-list.html");
            return;
        }
        
        document.getElementById("reqIdDisplay").innerText = reqId;

        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: "getStep1Data", reqId: reqId })
            });
            const result = await res.json();

            if(result.status === "success") {
                document.getElementById("borrowerNameDisplay").innerText = result.userName || "-";
                document.getElementById("adminNameDisplay").innerText = result.adminName || "-";
                
                const container = document.getElementById("ipadListContainer");
                container.innerHTML = "";

                if(result.data && result.data.length > 0) {
                    result.data.forEach(item => {
                        let id = item.ipadId;
                        let safeId = id.replace(/[^a-zA-Z0-9]/g, '');
                        
                        container.innerHTML += `
                        <div class="border rounded-4 mb-4 overflow-hidden shadow-sm bg-white" style="border-color: var(--admin-border) !important;">
                            <div class="d-flex justify-content-between align-items-center p-3 border-bottom bg-light">
                                <div class="fw-bold text-dark d-flex align-items-center gap-3">
                                    <input type="checkbox" class="form-check-input main-check m-0 shadow-sm" id="main-${safeId}" value="${id}" onchange="toggleSubChecks('${safeId}')">
                                    <label for="main-${safeId}" class="m-0 fs-5" style="color: var(--admin-main); cursor: pointer;">${id}</label>
                                </div>
                                <button type="button" class="btn btn-shortcut px-4 py-1 rounded-pill" onclick="tickAllRow('${safeId}')">ติ๊กครบ</button>
                            </div>
                            <div class="row text-center p-4">
                                <div class="col-3">
                                    <div class="small fw-bold mb-3 text-dark">G-Drive</div>
                                    <input type="checkbox" class="form-check-input sub-check-${safeId} mx-auto">
                                </div>
                                <div class="col-3">
                                    <div class="small fw-bold mb-3 text-dark">File</div>
                                    <input type="checkbox" class="form-check-input sub-check-${safeId} mx-auto">
                                </div>
                                <div class="col-3">
                                    <div class="small fw-bold mb-3 text-dark">รูปภาพ</div>
                                    <input type="checkbox" class="form-check-input sub-check-${safeId} mx-auto">
                                </div>
                                <div class="col-3">
                                    <div class="small fw-bold mb-3 text-dark">Safari</div>
                                    <input type="checkbox" class="form-check-input sub-check-${safeId} mx-auto">
                                </div>
                            </div>
                        </div>`;
                    });
                } else {
                    container.innerHTML = '<div class="text-danger fw-bold text-center py-4 fs-5">❌ ไม่พบข้อมูลอุปกรณ์ในระบบ</div>';
                }
            }
        } catch(e) {
            if (retryCount > 0) {
                document.getElementById("ipadListContainer").innerHTML = `<div class="text-center py-5 text-muted fw-bold">สัญญาณขัดข้อง กำลังลองใหม่... (${retryCount}) ⏳</div>`;
                setTimeout(() => loadStep5Data(retryCount - 1), 1500);
            } else {
                document.getElementById("ipadListContainer").innerHTML = '<div class="text-danger fw-bold text-center py-4 fs-5">❌ ขัดข้อง: ไม่สามารถเชื่อมต่อฐานข้อมูลได้</div>';
            }
        }
    }

    // 📌 ฟังก์ชันกด "ติ๊กครบ"
    function tickAllRow(safeId) {
        document.getElementById(`main-${safeId}`).checked = true;
        const checkboxes = document.querySelectorAll(`.sub-check-${safeId}`);
        checkboxes.forEach(cb => cb.checked = true);
    }

    // 📌 ฟังก์ชันเวลาผู้ใช้กดติ๊กที่ Checkbox อันใหญ่ (ซ้ายบน) ให้ติ๊กย่อยทั้งหมดตามไปด้วย
    function toggleSubChecks(safeId) {
        const isChecked = document.getElementById(`main-${safeId}`).checked;
        const checkboxes = document.querySelectorAll(`.sub-check-${safeId}`);
        checkboxes.forEach(cb => cb.checked = isChecked);
    }

    // 📌 ส่งข้อมูลตรวจสอบกลับเข้า Google Sheet
    async function submitStep5() {
        const reqId = document.getElementById("reqIdDisplay").innerText;
        const adminName = localStorage.getItem("userName") || "Admin";
        const borrowerName = document.getElementById("borrowerNameDisplay").innerText;

        const mainChecks = document.querySelectorAll('.main-check');
        let allChecked = true;
        let items = [];

        if (mainChecks.length === 0) {
            return Swal.fire("แจ้งเตือน", "ไม่มีข้อมูลอุปกรณ์ให้ตรวจสอบ", "warning");
        }

        mainChecks.forEach(cb => {
            const id = cb.value;
            const safeId = cb.id.replace('main-', '');
            const subs = document.querySelectorAll(`.sub-check-${safeId}`);
            
            let c1 = subs[0].checked ? "✅" : "☐";
            let c2 = subs[1].checked ? "✅" : "☐";
            let c3 = subs[2].checked ? "✅" : "☐";
            let c4 = subs[3].checked ? "✅" : "☐";

            // ถ้าไม่ติ๊กกล่องใหญ่ หรือ ไม่ติ๊กข้อใดข้อหนึ่ง = ข้อมูลไม่ครบ
            if(!cb.checked || !subs[0].checked || !subs[1].checked || !subs[2].checked || !subs[3].checked) {
                allChecked = false;
            }

            items.push({ ipadId: id, checks: [c1, c2, c3, c4] });
        });

        if(!allChecked) {
            return Swal.fire({
                title: "ข้อมูลไม่ครบถ้วน",
                text: "กรุณาติ๊กทำเครื่องหมายถูก ให้ครบทุกช่องและทุกเครื่องครับ",
                icon: "warning",
                confirmButtonColor: "#1e3a8a"
            });
        }

        const btn = document.getElementById("btnSubmit");
        btn.innerHTML = "กำลังบันทึกข้อมูล... ⏳";
        btn.disabled = true;

        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({
                    action: "saveStep5",
                    reqId: reqId,
                    name: adminName,
                    borrowerName: borrowerName,
                    items: items
                })
            });
            
            const rawText = await res.text();
            let result;
            
            try {
                result = JSON.parse(rawText);
            } catch (parseErr) {
                // ดักจับกรณี Google ตัดสาย แต่ข้อมูลเข้า Sheet ไปแล้ว
                if (navigator.onLine) {
                    Swal.fire({
                        title: "สำเร็จ!",
                        text: "ตรวจสอบรับคืนเรียบร้อย ปิดรายการสมบูรณ์",
                        icon: "success",
                        confirmButtonColor: "#1e3a8a",
                        allowOutsideClick: false
                    }).then(() => window.location.href = "step5-list.html");
                    return;
                }
            }

            if(result && result.status === "success") {
                Swal.fire({
                    title: "สำเร็จ!",
                    text: "ตรวจสอบรับคืนเรียบร้อย ปิดรายการสมบูรณ์",
                    icon: "success",
                    confirmButtonColor: "#1e3a8a",
                    allowOutsideClick: false
                }).then(() => window.location.href = "step5-list.html");
            } else {
                Swal.fire("ข้อผิดพลาด", result.message || "เกิดข้อผิดพลาดในการบันทึก", "error");
                btn.innerHTML = "ยืนยันการตรวจสอบเครื่องเสร็จสมบูรณ์"; 
                btn.disabled = false;
            }
        } catch(e) {
            if (navigator.onLine) {
                Swal.fire({
                    title: "สำเร็จ!",
                    text: "ตรวจสอบรับคืนเรียบร้อย ปิดรายการสมบูรณ์ (ข้อมูลถูกบันทึกแล้ว)",
                    icon: "success",
                    confirmButtonColor: "#1e3a8a",
                    allowOutsideClick: false
                }).then(() => window.location.href = "step5-list.html");
            } else {
                Swal.fire("ข้อผิดพลาด", "ไม่สามารถเชื่อมต่ออินเทอร์เน็ตได้", "error");
                btn.innerHTML = "ยืนยันการตรวจสอบเครื่องเสร็จสมบูรณ์"; 
                btn.disabled = false;
            }
        }
    }
</script>
</body>
</html>
