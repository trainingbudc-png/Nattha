<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 5 | ตรวจรับคืน</title>
	<link rel="icon" href="https://github.com/trainingbudc-png/Nattha/blob/main/%E0%B8%A3%E0%B8%B9%E0%B8%9B.png?raw=true" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme-admin.css">
    <style>
        body { background: #fdf2f2; font-family: 'Kanit', sans-serif; padding: 20px; }
        
        .main-header-card { background: white; padding: 20px 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(220,53,69,0.05); margin: auto; max-width: 900px; margin-bottom: 20px; border-left: 6px solid #dc3545; }
        .main-header-card h3 { color: #212529; font-weight: 600; margin: 0; font-size: 1.6rem; }
        
        .confirm-card { background: white; padding: 0; border-radius: 12px; box-shadow: 0 10px 25px rgba(220,53,69,0.08); max-width: 900px; margin: auto; overflow: hidden; border: 1px solid #fee2e2; }
        
        .red-header { background-color: #dc3545; color: white; padding: 15px 20px; font-weight: 600; font-size: 1.1rem; display: flex; justify-content: space-between; align-items: center; }
        .req-id-badge { background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 8px; font-size: 0.9rem; }
        
        .info-panel { padding: 15px 20px; background: #fef2f2; border-bottom: 1px solid #fca5a5; display: flex; justify-content: space-around; align-items: center; }
        .info-label { font-size: 0.85rem; color: #495057; font-weight: 600; text-transform: uppercase; margin-bottom: 4px; }
        .info-value { font-size: 1.1rem; font-weight: bold; color: #212529; }
        .divider { width: 1px; background-color: #fca5a5; height: 40px; }

        .btn-confirm { background: #dc3545; color: white; border-radius: 12px; padding: 15px; font-weight: bold; width: calc(100% - 40px); margin: 20px; border: none; transition: 0.3s; font-size: 1.1rem; }
        .btn-confirm:hover { background: #b91c1c; }

        /* 📌 ดีไซน์การ์ด iPad แบบใหม่ */
        .ipad-card { transition: all 0.3s ease; border-color: #e2e8f0; }
        .ipad-card.active-card { border-color: #dc3545 !important; box-shadow: 0 4px 15px rgba(220,53,69,0.08) !important; transform: translateY(-2px); }
        
        /* 📌 ปรับสีและขนาด Checkbox ให้เป็นธีมแดงของ Step 5 */
        .select-ipad { width: 26px !important; height: 26px !important; cursor: pointer; accent-color: #dc3545; transition: transform 0.2s; }
        .select-ipad:active { transform: scale(0.9); }
        
        .check-item { width: 22px !important; height: 22px !important; cursor: pointer; accent-color: #dc3545; }

        @media screen and (max-width: 768px) {
            .info-panel { flex-direction: column; gap: 15px; }
            .divider { width: 100%; height: 1px; }
        }
    </style>
</head>
<body>

<div class="main-header-card d-flex justify-content-between align-items-center">
    <h3>🔍Step 5 | ตรวจรับคืน</h3>
    <a href="step5-list.html" class="btn btn-outline-secondary px-3 fw-bold rounded-pill btn-sm border-2">🔙 กลับ</a>
</div>

<div class="confirm-card">
    <div class="red-header">
        <span>iPad ที่ส่งคืน</span>
        <span class="req-id-badge" id="headerReqId">รายการ: Loading...</span>
    </div>
    
    <div class="info-panel">
        <div class="text-center">
            <div class="info-label">👤 ผู้ขอเบิกยืม</div>
            <div id="displayUserName" class="info-value">กำลังโหลด...</div>
        </div>
        <div class="divider"></div>
        <div class="text-center">
            <div class="info-label">👨‍💻 แอดมินผู้เตรียม</div>
            <div id="displayAdminName" class="info-value">กำลังโหลด...</div>
        </div>
    </div>

    <!-- 📌 คอนเทนเนอร์ใส่การ์ดแทนตารางเดิม -->
    <div id="itemList" class="d-flex flex-column gap-3 p-4">
        <div class="text-center text-muted py-4">กำลังโหลดข้อมูลเครื่อง... ⏳</div>
    </div>

    <button class="btn btn-confirm shadow-sm" onclick="submitCheck()">ยืนยันการตรวจสอบเครื่องเสร็จสมบูรณ์</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> <script src="script.js"></script>
<script>
    const reqId = new URLSearchParams(window.location.search).get('reqId');

    window.onload = function() {
        if(!reqId) { Swal.fire("แจ้งเตือน","ไม่พบเลขรายการ","warning"); return; }
        document.getElementById('headerReqId').innerText = "รายการ: " + reqId;

        fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getStep1Data", reqId: reqId }) })
        .then(res => res.json())
        .then(res => {
            if (res.reqStatus && res.reqStatus !== "Step[4]") {
                Swal.fire("แจ้งเตือน", `รายการนี้ถูกตรวจสอบปิดจบไปแล้ว (สถานะ: ${res.reqStatus})`, "warning").then(() => {
                    window.location.href = "admin.html";
                });
                return;
            }

            document.getElementById('displayUserName').innerText = res.userName || "ไม่ระบุ";
            document.getElementById('displayAdminName').innerText = res.adminName || "ไม่ระบุ";

            const container = document.getElementById('itemList');
            container.innerHTML = "";
            
            if(res.data && res.data.length > 0) {
                res.data.forEach((item) => {
                    // 📌 เสกปุ่มลัดติ๊กครบกลับมาให้แอดมิน
                    let adminBtn = `<button type="button" class="btn btn-dark btn-sm fw-bold px-3 rounded-pill shadow-sm" onclick="tickAllInCard(this)">ติ๊กครบ</button>`;
                    
                    container.innerHTML += `
                    <div class="ipad-card bg-white border border-2 rounded-4 overflow-hidden transition-all" data-ipad="${item.ipadId}">
                        <!-- แถบหัวข้อสีเทาอ่อน -->
                        <div class="bg-light border-bottom px-4 py-3 d-flex justify-content-between align-items-center">
                            <div class="d-flex align-items-center gap-3">
                                <input type="checkbox" class="select-ipad form-check-input m-0 shadow-sm" id="btn-${item.ipadId}" data-target="collapse-${item.ipadId}" onchange="toggleCard(this)">
                                <label for="btn-${item.ipadId}" style="cursor:pointer;" class="text-dark fw-bold fs-5 mb-0">${item.ipadId}</label>
                            </div>
                            ${adminBtn}
                        </div>
                        
                        <!-- เนื้อหาที่กางออกมา (ข้อความอยู่บน กล่องติ๊กอยู่ล่าง) -->
                        <div class="collapse" id="collapse-${item.ipadId}">
                            <div class="p-4 d-flex flex-wrap align-items-center justify-content-around gap-3">
                                <label class="d-flex flex-column align-items-center gap-2 mb-0" style="cursor: pointer; min-width: 60px;">
                                    <span class="fw-bold text-dark text-center" style="font-size: 0.9rem;">G-Drive</span>
                                    <input type="checkbox" class="check-item form-check-input m-0 shadow-sm flex-shrink-0">
                                </label>
                                <label class="d-flex flex-column align-items-center gap-2 mb-0" style="cursor: pointer; min-width: 60px;">
                                    <span class="fw-bold text-dark text-center" style="font-size: 0.9rem;">File</span>
                                    <input type="checkbox" class="check-item form-check-input m-0 shadow-sm flex-shrink-0">
                                </label>
                                <label class="d-flex flex-column align-items-center gap-2 mb-0" style="cursor: pointer; min-width: 60px;">
                                    <span class="fw-bold text-dark text-center" style="font-size: 0.9rem;">รูปภาพ</span>
                                    <input type="checkbox" class="check-item form-check-input m-0 shadow-sm flex-shrink-0">
                                </label>
                                <label class="d-flex flex-column align-items-center gap-2 mb-0" style="cursor: pointer; min-width: 60px;">
                                    <span class="fw-bold text-dark text-center" style="font-size: 0.9rem;">Safari</span>
                                    <input type="checkbox" class="check-item form-check-input m-0 shadow-sm flex-shrink-0">
                                </label>
                            </div>
                        </div>
                    </div>`;
                });
            } else { container.innerHTML = '<div class="text-danger py-4 text-center">❌ ไม่พบรายการเครื่อง</div>'; }
        });
    };

    function toggleCard(checkbox) {
        const targetId = checkbox.dataset.target;
        const collapseElement = document.getElementById(targetId);
        const bsCollapse = bootstrap.Collapse.getOrCreateInstance(collapseElement, { toggle: false });
        const card = checkbox.closest('.ipad-card');
        
        if (checkbox.checked) {
            bsCollapse.show();
            card.classList.add('active-card');
        } else {
            bsCollapse.hide();
            card.classList.remove('active-card');
            collapseElement.querySelectorAll('.check-item').forEach(cb => cb.checked = false); 
        }
    }

    function tickAllInCard(btn) {
        const card = btn.closest('.ipad-card');
        const mainCheck = card.querySelector('.select-ipad');
        if (!mainCheck.checked) {
            mainCheck.checked = true;
            toggleCard(mainCheck);
        }
        card.querySelectorAll('.check-item').forEach(cb => { 
            cb.checked = true; 
        });
    }

    async function submitCheck() {
        let items = [];
        let isAllChecked = true; 

        const cards = document.querySelectorAll('.ipad-card');
        
        if(cards.length === 0) {
            Swal.fire("ข้อผิดพลาด", "ไม่พบข้อมูลเครื่องที่ต้องตรวจสอบ", "error");
            return;
        }

        cards.forEach(card => {
            const checks = Array.from(card.querySelectorAll('.check-item'));
            
            if (checks.some(c => !c.checked)) {
                isAllChecked = false;
            }

            const checkValues = checks.map(c => c.checked ? "☑" : "☐");
            items.push({ ipadId: card.dataset.ipad, checks: checkValues });
        });

        if (!isAllChecked) {
            Swal.fire({ title: "⚠️ ข้อมูลไม่ครบถ้วน", text: "กรุณาตรวจสอบและติ๊กรายการให้ครบทุกข้อ สำหรับ iPad ทุกเครื่องครับ!", icon: "warning", confirmButtonColor: "#dc3545" });
            return;
        }
        
        const btn = document.querySelector('.btn-confirm');
        const originalText = btn.innerText; btn.innerText = "⏳ กำลังบันทึกข้อมูล..."; btn.disabled = true;

        const borrowerName = document.getElementById('displayUserName').innerText;

        try {
            await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "saveStep5", reqId: reqId, items: items, name: localStorage.getItem("userName") || "Admin", borrowerName: borrowerName }) });
            
            Swal.fire({
                title: "ตรวจสอบเสร็จสิ้น!",
                html: `หมายเลขรายการ: <b>${reqId}</b><br>บันทึกผลการตรวจสอบ ${items.length} เครื่องลงระบบเรียบร้อยแล้ว`,
                icon: "success",
                confirmButtonColor: "#dc3545",
                confirmButtonText: "OK",
                allowOutsideClick: false
            }).then(() => {
                window.location.href = "admin.html";
            });

        } catch (error) {
            Swal.fire("❌ เกิดข้อผิดพลาด", "ในการบันทึก กรุณาลองใหม่", "error"); btn.innerText = originalText; btn.disabled = false;
        }
    }
</script>
</body>
</html>
