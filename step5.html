<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 5 | ตรวจสอบรับคืนเครื่อง</title>
    <link rel="icon" href="https://github.com/trainingbudc-png/Nattha/blob/main/%E0%B8%A3%E0%B8%B9%E0%B8%9B.png?raw=true" type="image/png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="theme-admin.css">
    
    <style>
        body { background: var(--admin-bg); font-family: 'Kanit', sans-serif; padding: 20px; }
        
        .confirm-card { 
            background: white; 
            border-radius: 20px; 
            box-shadow: 0 4px 20px rgba(30, 58, 138, 0.05); 
            max-width: 950px; 
            margin: auto; 
            border: none !important; 
            overflow: hidden;
        }

        .card-header-navy {
            background-color: var(--admin-main);
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge-req {
            background-color: white !important;
            color: var(--admin-main) !important;
            border: 1px solid #cbd5e1;
            font-size: 0.95rem;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 50rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .form-check-input { 
            width: 24px !important; height: 24px !important; 
            cursor: pointer; 
            border: 2px solid #94a3b8 !important; 
            transition: all 0.2s;
        }
        .form-check-input:checked {
            background-color: var(--admin-main) !important;
            border-color: var(--admin-main) !important;
        }

        /* 🚨 สไตล์ตารางแบบกะทัดรัด (ยึดตาม Step 1) */
        .table-responsive { border-radius: 12px; border: 1px solid var(--admin-border); overflow: hidden; }
        .table { margin-bottom: 0; }
        .table th { background-color: var(--admin-bg); color: var(--admin-main); font-weight: 600; text-align: center; padding: 15px; border-bottom: 2px solid var(--admin-main); font-size: 0.95rem; white-space: nowrap; }
        .table td { vertical-align: middle; text-align: center; padding: 12px 10px; border-bottom: 1px solid var(--admin-border); color: #1e293b; font-weight: 500; font-size: 0.95rem; }
        .table tbody tr:hover { background-color: #f8fafc; }

        .btn-shortcut { 
            background: white; color: var(--admin-main); border: 2px solid var(--admin-main); 
            transition: 0.2s; border-radius: 8px; font-size: 0.85rem; font-weight: 600;
        }
        .btn-shortcut:hover { background: var(--admin-main); color: white; }

        .btn-ticked-all {
            background-color: var(--admin-main) !important;
            color: white !important;
        }

        .btn-admin-solid {
            background-color: var(--admin-main);
            color: white;
            border-radius: 12px;
            padding: 15px;
            border: none;
            transition: 0.3s;
        }
        .btn-admin-solid:hover {
            background-color: var(--admin-hover);
            color: white;
            box-shadow: 0 6px 15px rgba(30, 58, 138, 0.4);
        }

        /* 📱 ปรับหน้าจอเมื่อแสดงบนมือถือ (ให้เรียงแบบกล่องเล็กๆ อ้างอิง Step 1) */
        @media (max-width: 768px) {
            body { padding: 10px; }
            .confirm-card { padding-bottom: 20px; }
            .card-header-navy { padding: 15px; flex-direction: column; gap: 10px; text-align: center; }

            .table-responsive { border: none; background: transparent; padding: 0; overflow: visible; }
            .table thead { display: none; }
            .table tbody tr { 
                display: flex; flex-wrap: wrap; background: #ffffff; border-radius: 14px; 
                margin-bottom: 16px; padding: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
                border: 1px solid var(--admin-border); 
            }
            .table tbody td { display: flex; align-items: center; padding: 8px 0; border: none !important; }
            .table tbody td::before { content: attr(data-label); font-weight: 600; color: #64748b; font-size: 0.85rem; }
            
            .table tbody td[data-label="รหัส iPad"] {
                width: calc(100% + 24px); margin: -12px -12px 12px -12px; padding: 12px 16px !important;
                justify-content: space-between; background-color: #f1f5f9; 
                border-bottom: 2px solid var(--admin-main) !important; border-radius: 14px 14px 0 0; 
            }
            .table tbody td[data-label="รหัส iPad"]::before { display: none; }

            .table tbody td[data-label="G-Drive"],
            .table tbody td[data-label="File"],
            .table tbody td[data-label="รูปภาพ"],
            .table tbody td[data-label="Safari"] {
                width: calc(50% - 6px); margin: 3px; flex-direction: row; justify-content: space-between; 
                align-items: center; padding: 12px 14px; background: #f8fafc;
                border: 1px solid #e2e8f0 !important; border-radius: 10px;
            }
            .table tbody td[data-label="G-Drive"]::before,
            .table tbody td[data-label="File"]::before,
            .table tbody td[data-label="รูปภาพ"]::before,
            .table tbody td[data-label="Safari"]::before {
                margin-right: 10px; color: #1e293b; font-size: 0.9rem; font-weight: 600;
            }

            .table tbody td input[type="checkbox"] { width: 22px !important; height: 22px !important; margin: 0 !important; flex-shrink: 0; }
            .table tbody td[data-label="จัดการ"] { width: 100%; margin-top: 8px; padding: 0 3px; }
            .table tbody td[data-label="จัดการ"]::before { display: none; }
            .table tbody td[data-label="จัดการ"] .btn { padding: 12px !important; font-size: 1rem; border-radius: 10px; }
        }
    </style>
</head>
<body>
    
    <div class="container pb-5">
        <div class="text-end" style="max-width: 950px; margin: 0 auto 15px auto;">
            <button class="btn bg-white shadow-sm fw-bold rounded-pill px-4" style="color: var(--admin-main); border: 2px solid var(--admin-main);" onclick="window.location.href='step5-list.html'">🔙 กลับ</button>
        </div>

        <div class="confirm-card">
            <div class="card-header-navy">
                <h5 class="m-0 fw-bold">📱 Step 5 | ตรวจสอบรับคืนเครื่อง</h5>
                <div class="badge-req">รายการ: <span id="reqIdDisplay">กำลังโหลด...</span></div>
            </div>
            
            <div class="p-3 p-md-4 p-lg-5">
                <div class="row text-center mb-4 pb-3 border-bottom g-2">
                    <div class="col-6 border-end px-2">
                        <div class="text-muted small fw-bold mb-1">👤 ผู้ขอเบิกยืม</div>
                        <div class="fw-bold text-truncate" style="color: var(--admin-main); font-size: 1.05rem;" id="borrowerNameDisplay">-</div>
                    </div>
                    <div class="col-6 px-2">
                        <div class="text-muted small fw-bold mb-1">👮 แอดมินผู้เตรียม</div>
                        <div class="fw-bold text-truncate" style="color: var(--admin-main); font-size: 1.05rem;" id="adminNameDisplay">-</div>
                    </div>
                </div>

                <div id="ipadListContainer">
                    <div class="text-center py-5 text-muted fw-bold">กำลังเชื่อมต่อข้อมูล... ⏳</div>
                </div>

                <button type="button" class="btn btn-admin-solid w-100 mt-4 fw-bold fs-5 shadow-sm" id="btnSubmit" onclick="submitStep5()">ยืนยันการตรวจสอบเสร็จสมบูรณ์</button>
            </div>
        </div>
    </div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="script.js"></script>

<script>
    window.onload = function() {
        if(localStorage.getItem("userRole") !== "Admin") { 
            window.location.href="index.html"; 
            return; 
        }
        loadStep5Data();
    };

    async function loadStep5Data(retryCount = 3) {
        const urlParams = new URLSearchParams(window.location.search);
        const reqId = urlParams.get('reqId');
        
        if(!reqId) {
            Swal.fire("ข้อผิดพลาด", "ไม่พบหมายเลขรายการ", "error").then(() => window.location.href="step5-list.html");
            return;
        }
        
        document.getElementById("reqIdDisplay").innerText = reqId;

        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: "getStep1Data", reqId: reqId })
            });
            const result = await res.json();

            if(result.status === "success") {
                document.getElementById("borrowerNameDisplay").innerText = result.userName || "-";
                document.getElementById("adminNameDisplay").innerText = result.adminName || "-";
                
                const container = document.getElementById("ipadListContainer");
                container.innerHTML = "";

                // 🚨 สร้างตารางครอบข้อมูล แบบเดียวกับ Step 1
                if(result.data && result.data.length > 0) {
                    let tableHTML = `
                    <label class="form-label fw-bold mb-3 d-none d-md-block" style="color: var(--admin-main);">
                        ✅ รายการอุปกรณ์ที่แอดมินต้องตรวจสอบ 
                        <span class="text-muted fw-normal" style="font-size: 0.85rem;">(เช็คให้ครบทุกเครื่อง)</span>
                    </label>
                    <div class="table-responsive bg-white shadow-sm mb-2">
                        <table class="table align-middle">
                            <thead>
                                <tr>
                                    <th class="text-start ps-4" style="width: 25%;">รหัส iPad</th>
                                    <th>G-Drive</th>
                                    <th>File</th>
                                    <th>รูปภาพ</th>
                                    <th>Safari</th>
                                    <th style="width: 15%;">จัดการ</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    result.data.forEach(item => {
                        let id = item.ipadId;
                        let safeId = id.replace(/[^a-zA-Z0-9]/g, '');
                        
                        tableHTML += `
                                <tr>
                                    <td data-label="รหัส iPad" class="text-start ps-md-4">
                                        <div class="d-flex align-items-center gap-2">
                                            <input type="checkbox" class="form-check-input main-check m-0 shadow-sm" id="main-${safeId}" value="${id}" onchange="toggleSubChecks('${safeId}')" style="flex-shrink: 0;">
                                            <label for="main-${safeId}" class="fw-bold m-0 text-truncate" style="color: var(--admin-main); font-size: 1.1rem; cursor: pointer;">📱 ${id}</label>
                                        </div>
                                    </td>
                                    <td data-label="G-Drive"><input type="checkbox" class="form-check-input sub-check-${safeId} m-0 shadow-sm"></td>
                                    <td data-label="File"><input type="checkbox" class="form-check-input sub-check-${safeId} m-0 shadow-sm"></td>
                                    <td data-label="รูปภาพ"><input type="checkbox" class="form-check-input sub-check-${safeId} m-0 shadow-sm"></td>
                                    <td data-label="Safari"><input type="checkbox" class="form-check-input sub-check-${safeId} m-0 shadow-sm"></td>
                                    <td data-label="จัดการ">
                                        <button type="button" class="btn btn-shortcut btn-sm px-3 w-100" onclick="tickAllRow('${safeId}', this)">ติ๊กครบ</button>
                                    </td>
                                </tr>
                        `;
                    });

                    tableHTML += `</tbody></table></div>`;
                    container.innerHTML = tableHTML;

                } else {
                    container.innerHTML = '<div class="text-danger fw-bold text-center py-4 fs-5">❌ ไม่พบข้อมูลอุปกรณ์ในระบบ</div>';
                }
            }
        } catch(e) {
            if (retryCount > 0) {
                document.getElementById("ipadListContainer").innerHTML = `<div class="text-center py-5 text-muted fw-bold">สัญญาณขัดข้อง กำลังลองใหม่... (${retryCount}) ⏳</div>`;
                setTimeout(() => loadStep5Data(retryCount - 1), 1500);
            } else {
                document.getElementById("ipadListContainer").innerHTML = '<div class="text-danger fw-bold text-center py-4 fs-5">❌ ขัดข้อง: ไม่สามารถเชื่อมต่อฐานข้อมูลได้</div>';
            }
        }
    }

    function tickAllRow(safeId, btn) {
        document.getElementById(`main-${safeId}`).checked = true;
        const checkboxes = document.querySelectorAll(`.sub-check-${safeId}`);
        checkboxes.forEach(cb => cb.checked = true);

        if(btn) {
            btn.classList.add('btn-ticked-all');

            checkboxes.forEach(cb => {
                cb.addEventListener('change', function() {
                    if(!this.checked) {
                        btn.classList.remove('btn-ticked-all');
                    }
                }, { once: true });
            });
            document.getElementById(`main-${safeId}`).addEventListener('change', function() {
                 if(!this.checked) {
                     btn.classList.remove('btn-ticked-all');
                 }
            }, { once: true });
        }
    }

    function toggleSubChecks(safeId) {
        const isChecked = document.getElementById(`main-${safeId}`).checked;
        const checkboxes = document.querySelectorAll(`.sub-check-${safeId}`);
        checkboxes.forEach(cb => cb.checked = isChecked);
    }

    async function submitStep5() {
        const reqId = document.getElementById("reqIdDisplay").innerText;
        const adminName = localStorage.getItem("userName") || "Admin";
        const borrowerName = document.getElementById("borrowerNameDisplay").innerText;

        const mainChecks = document.querySelectorAll('.main-check');
        let allChecked = true;
        let items = [];

        if (mainChecks.length === 0) {
            return Swal.fire("แจ้งเตือน", "ไม่มีข้อมูลอุปกรณ์ให้ตรวจสอบ", "warning");
        }

        mainChecks.forEach(cb => {
            const id = cb.value;
            const safeId = cb.id.replace('main-', '');
            const subs = document.querySelectorAll(`.sub-check-${safeId}`);
            
            let c1 = subs[0].checked ? "✅" : "☐";
            let c2 = subs[1].checked ? "✅" : "☐";
            let c3 = subs[2].checked ? "✅" : "☐";
            let c4 = subs[3].checked ? "✅" : "☐";

            if(!cb.checked || !subs[0].checked || !subs[1].checked || !subs[2].checked || !subs[3].checked) {
                allChecked = false;
            }

            items.push({ ipadId: id, checks: [c1, c2, c3, c4] });
        });

        if(!allChecked) {
            return Swal.fire({
                title: "ข้อมูลไม่ครบถ้วน",
                text: "กรุณาติ๊กทำเครื่องหมายถูก ให้ครบทุกช่องและทุกเครื่องครับ",
                icon: "warning",
                confirmButtonColor: "#1e3a8a"
            });
        }

        const btn = document.getElementById("btnSubmit");
        btn.innerHTML = "กำลังบันทึกข้อมูล... ⏳";
        btn.disabled = true;

        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({
                    action: "saveStep5",
                    reqId: reqId,
                    name: adminName,
                    borrowerName: borrowerName,
                    items: items,
                    userId: localStorage.getItem("userId") 
                })
            });
            
            const rawText = await res.text();
            let result;
            
            try {
                result = JSON.parse(rawText);
            } catch (parseErr) {
                if (navigator.onLine) {
                    Swal.fire({
                        title: "สำเร็จ!",
                        text: "ตรวจสอบรับคืนเรียบร้อย",
                        icon: "success",
                        confirmButtonColor: "#1e3a8a",
                        allowOutsideClick: false
                    }).then(() => window.location.href = "step5-list.html");
                    return;
                }
            }

            if(result && result.status === "success") {
                Swal.fire({
                    title: "สำเร็จ!",
                    text: "ตรวจสอบรับคืนเรียบร้อย ปิดรายการสมบูรณ์",
                    icon: "success",
                    confirmButtonColor: "#1e3a8a",
                    allowOutsideClick: false
                }).then(() => window.location.href = "step5-list.html");
            } else {
                Swal.fire("ข้อผิดพลาด", result.message || "เกิดข้อผิดพลาดในการบันทึก", "error");
                btn.innerHTML = "ยืนยันการตรวจสอบเสร็จสมบูรณ์"; 
                btn.disabled = false;
            }
        } catch(e) {
            if (navigator.onLine) {
                Swal.fire({
                    title: "สำเร็จ!",
                    text: "ตรวจสอบรับคืนเรียบร้อย ปิดรายการสมบูรณ์ (ข้อมูลถูกบันทึกแล้ว)",
                    icon: "success",
                    confirmButtonColor: "#1e3a8a",
                    allowOutsideClick: false
                }).then(() => window.location.href = "step5-list.html");
            } else {
                Swal.fire("ข้อผิดพลาด", "ไม่สามารถเชื่อมต่ออินเทอร์เน็ตได้", "error");
                btn.innerHTML = "ยืนยันการตรวจสอบเสร็จสมบูรณ์"; 
                btn.disabled = false;
            }
        }
    }
</script>
</body>
</html>
