<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 5 | ตรวจรับคืน</title>
    <link rel="icon" href="https://github.com/trainingbudc-png/Nattha/blob/main/%E0%B8%A3%E0%B8%B9%E0%B8%9B.png?raw=true" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="theme-admin.css">
    <style>
        .info-panel { padding: 15px 20px; background: #f1f5f9; border-bottom: 1px solid var(--admin-border); display: flex; justify-content: space-around; align-items: center; }
        .info-label { font-size: 0.85rem; color: #475569; font-weight: 600; text-transform: uppercase; margin-bottom: 4px; }
        .info-value { font-size: 1.1rem; font-weight: bold; color: var(--admin-main); }
        .divider { width: 1px; background-color: var(--admin-border); height: 40px; }
        @media screen and (max-width: 768px) { .info-panel { flex-direction: column; gap: 15px; } .divider { width: 100%; height: 1px; } }
    </style>
</head>
<body>

<div class="nav-header-custom shadow-sm mb-4">
    <div class="nav-title-custom fw-bold">🔍 Step 5 | ตรวจรับคืน</div>
    <a href="step5-list.html" class="btn btn-light text-dark btn-sm rounded-pill fw-bold px-4">🔙 กลับ</a>
</div>

<div class="container pb-5" style="max-width: 900px;">
    <div class="confirm-card overflow-hidden">
        <div class="red-header">
            <span>iPad ที่ส่งคืน</span>
            <span class="badge bg-light text-dark px-3 py-2 rounded-pill" id="headerReqId">รายการ: Loading...</span>
        </div>
        
        <div class="info-panel">
            <div class="text-center">
                <div class="info-label">👤 ผู้ขอเบิกยืม</div>
                <div id="displayUserName" class="info-value">กำลังโหลด...</div>
            </div>
            <div class="divider"></div>
            <div class="text-center">
                <div class="info-label">👨‍💻 แอดมินผู้เตรียม</div>
                <div id="displayAdminName" class="info-value">กำลังโหลด...</div>
            </div>
        </div>

        <div id="itemList" class="d-flex flex-column gap-3 p-4">
            <div class="text-center text-muted py-4">กำลังโหลดข้อมูลเครื่อง... ⏳</div>
        </div>

        <div class="p-4 pt-0">
            <button class="btn btn-confirm w-100 shadow-sm py-3 fs-5 rounded-3" onclick="submitCheck()">ยืนยันการตรวจสอบเครื่องเสร็จสมบูรณ์</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> <script src="script.js"></script>
<script>
    const reqId = new URLSearchParams(window.location.search).get('reqId');

    window.onload = function() {
        if(!reqId) { Swal.fire("แจ้งเตือน","ไม่พบเลขรายการ","warning"); return; }
        document.getElementById('headerReqId').innerText = "รายการ: " + reqId;

        fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getStep1Data", reqId: reqId }) })
        .then(res => res.json())
        .then(res => {
            if (res.reqStatus && res.reqStatus !== "Step[4]") {
                Swal.fire("แจ้งเตือน", `รายการนี้ถูกตรวจสอบปิดจบไปแล้ว`, "warning").then(() => { window.location.href = "admin.html"; }); return;
            }

            document.getElementById('displayUserName').innerText = res.userName || "ไม่ระบุ";
            document.getElementById('displayAdminName').innerText = res.adminName || "ไม่ระบุ";

            const container = document.getElementById('itemList');
            container.innerHTML = "";
            
            if(res.data && res.data.length > 0) {
                res.data.forEach((item) => {
                    let adminBtn = `<button type="button" class="btn btn-outline-admin btn-sm fw-bold px-3 rounded-pill shadow-sm" onclick="tickAllInCard(this)">ติ๊กครบ</button>`;
                    
                    container.innerHTML += `
                    <div class="ipad-card bg-white border border-2 rounded-4 overflow-hidden transition-all" data-ipad="${item.ipadId}">
                        <div class="bg-light border-bottom px-4 py-3 d-flex justify-content-between align-items-center">
                            <div class="d-flex align-items-center gap-3">
                                <input type="checkbox" class="select-ipad form-check-input m-0 shadow-sm" id="btn-${item.ipadId}" data-target="collapse-${item.ipadId}" onchange="toggleCard(this)">
                                <label for="btn-${item.ipadId}" style="cursor:pointer;" class="text-dark fw-bold fs-5 mb-0">${item.ipadId}</label>
                            </div>
                            ${adminBtn}
                        </div>
                        <div class="collapse" id="collapse-${item.ipadId}">
                            <div class="p-4 d-flex flex-wrap align-items-center justify-content-around gap-3">
                                <label class="d-flex flex-column align-items-center gap-2 mb-0" style="cursor: pointer; min-width: 60px;">
                                    <span class="fw-bold text-dark text-center" style="font-size: 0.9rem;">G-Drive</span>
                                    <input type="checkbox" class="check-item form-check-input m-0 shadow-sm flex-shrink-0">
                                </label>
                                <label class="d-flex flex-column align-items-center gap-2 mb-0" style="cursor: pointer; min-width: 60px;">
                                    <span class="fw-bold text-dark text-center" style="font-size: 0.9rem;">File</span>
                                    <input type="checkbox" class="check-item form-check-input m-0 shadow-sm flex-shrink-0">
                                </label>
                                <label class="d-flex flex-column align-items-center gap-2 mb-0" style="cursor: pointer; min-width: 60px;">
                                    <span class="fw-bold text-dark text-center" style="font-size: 0.9rem;">รูปภาพ</span>
                                    <input type="checkbox" class="check-item form-check-input m-0 shadow-sm flex-shrink-0">
                                </label>
                                <label class="d-flex flex-column align-items-center gap-2 mb-0" style="cursor: pointer; min-width: 60px;">
                                    <span class="fw-bold text-dark text-center" style="font-size: 0.9rem;">Safari</span>
                                    <input type="checkbox" class="check-item form-check-input m-0 shadow-sm flex-shrink-0">
                                </label>
                            </div>
                        </div>
                    </div>`;
                });
            } else { container.innerHTML = '<div class="text-danger py-4 text-center">❌ ไม่พบรายการเครื่อง</div>'; }
        });
    };

    function toggleCard(checkbox) {
        const targetId = checkbox.dataset.target;
        const collapseElement = document.getElementById(targetId);
        const bsCollapse = bootstrap.Collapse.getOrCreateInstance(collapseElement, { toggle: false });
        const card = checkbox.closest('.ipad-card');
        if (checkbox.checked) { bsCollapse.show(); card.classList.add('active-card'); } 
        else { bsCollapse.hide(); card.classList.remove('active-card'); collapseElement.querySelectorAll('.check-item').forEach(cb => cb.checked = false); }
    }

    function tickAllInCard(btn) {
        const card = btn.closest('.ipad-card');
        const mainCheck = card.querySelector('.select-ipad');
        if (!mainCheck.checked) { mainCheck.checked = true; toggleCard(mainCheck); }
        card.querySelectorAll('.check-item').forEach(cb => { cb.checked = true; });
    }

    async function submitCheck() {
        let items = []; let isAllChecked = true; 
        const cards = document.querySelectorAll('.ipad-card');
        if(cards.length === 0) { Swal.fire("ข้อผิดพลาด", "ไม่พบข้อมูลเครื่องที่ต้องตรวจสอบ", "error"); return; }

        cards.forEach(card => {
            const checks = Array.from(card.querySelectorAll('.check-item'));
            if (checks.some(c => !c.checked)) { isAllChecked = false; }
            const checkValues = checks.map(c => c.checked ? "☑" : "☐");
            items.push({ ipadId: card.dataset.ipad, checks: checkValues });
        });

        if (!isAllChecked) { Swal.fire({ title: "⚠️ ข้อมูลไม่ครบถ้วน", text: "กรุณาตรวจสอบและติ๊กรายการให้ครบทุกข้อ สำหรับ iPad ทุกเครื่องครับ!", icon: "warning", confirmButtonColor: "#1e3a8a" }); return; }
        
        const btn = document.querySelector('.btn-confirm');
        const originalText = btn.innerText; btn.innerText = "⏳ กำลังบันทึกข้อมูล..."; btn.disabled = true;
        const borrowerName = document.getElementById('displayUserName').innerText;

        try {
            await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "saveStep5", reqId: reqId, items: items, name: localStorage.getItem("userName") || "Admin", borrowerName: borrowerName }) });
            Swal.fire({ title: "ตรวจสอบเสร็จสิ้น!", html: `หมายเลขรายการ: <b>${reqId}</b><br>บันทึกผลการตรวจสอบลงระบบเรียบร้อย`, icon: "success", confirmButtonColor: "#1e3a8a", allowOutsideClick: false })
            .then(() => { window.location.href = "admin.html"; });
        } catch (error) { Swal.fire("❌ เกิดข้อผิดพลาด", "ในการบันทึก กรุณาลองใหม่", "error"); btn.innerText = originalText; btn.disabled = false; }
    }
</script>
</body>
</html>
