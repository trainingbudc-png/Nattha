<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 5 | ตรวจรับคืน</title>
	<link rel="icon" href="https://github.com/trainingbudc-png/Nattha/blob/main/%E0%B8%A3%E0%B8%B9%E0%B8%9B.png?raw=true" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme-admin.css">
    <style>
        body { background: #fdf2f2; font-family: 'Kanit', sans-serif; padding: 20px; }
        .confirm-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 4px 20px rgba(220,53,69,0.05); max-width: 950px; margin: auto; border: 1px solid #fecaca; }
        
        /* 📌 Info Box (สไตล์เดียวกับฝั่ง User แต่เป็นโทนสีแดง) */
        .info-box { background-color: #fef2f2; border: 1px solid #fca5a5; border-radius: 12px; padding: 20px; margin-bottom: 25px; display: flex; justify-content: space-around; align-items: center; }
        .info-label { font-size: 0.85rem; color: #495057; font-weight: 600; text-transform: uppercase; margin-bottom: 4px; }
        .info-value { font-size: 1.15rem; font-weight: bold; color: #212529; }
        .divider { width: 1px; background-color: #fca5a5; height: 50px; }

        /* 💻 สไตล์ตารางสำหรับจอคอม (Desktop) */
        .table-responsive { border-radius: 12px; border: 1px solid #fca5a5; overflow: hidden; }
        .table { margin-bottom: 0; }
        .table th { background-color: #fef2f2; color: #212529; font-weight: 600; text-align: center; padding: 15px; border-bottom: 2px solid #fca5a5; font-size: 0.95rem; white-space: nowrap; }
        .table td { vertical-align: middle; text-align: center; padding: 12px 10px; border-bottom: 1px solid #fee2e2; color: #1e293b; font-weight: 500; font-size: 0.95rem; }
        .table tbody tr:hover { background-color: #fff9f9; }
        
        /* 📌 ปุ่ม Checkbox และปุ่มยืนยัน */
        .check-item { width: 24px !important; height: 24px !important; cursor: pointer; accent-color: #dc3545; }
        .btn-confirm { background: #dc3545; color: white; border-radius: 12px; padding: 15px; font-weight: bold; width: 100%; margin-top: 25px; transition: 0.3s; border: none; font-size: 1.1rem; }
        .btn-confirm:hover { background: #b91c1c; color: white; }
.btn-shortcut { background: white; color: #212529; border: 2px solid #dc3545; transition: 0.2s; }
        .btn-shortcut:hover { background: #dc3545; color: white; }

        /* 📱 ปรับการ์ดบนหน้าจอมือถือ (Mobile) */
        @media (max-width: 768px) {
            .info-box { flex-direction: column; text-align: center; gap: 15px; }
            .divider { width: 50px; height: 1px; }
            .table-responsive { border: none; }
            .table thead { display: none; }
            .table tbody tr { display: block; background: #ffffff; border-radius: 16px; margin-bottom: 16px; padding: 16px 20px; box-shadow: 0 4px 15px rgba(220,53,69,0.06); border: 1px solid #fecaca; }
            .table tbody td { display: flex; justify-content: space-between; align-items: center; text-align: right; padding: 12px 0; border-bottom: 1px solid #fee2e2; }
            .table tbody td::before { content: attr(data-label); font-weight: 500; color: #64748b; font-size: 0.95rem; text-align: left; margin-right: 15px; }
            
            /* แยกเส้นแบ่งระหว่าง หัวข้อการ์ด กับ เช็คลิสต์ ให้ชัดเจน */
            .table tbody td:first-child { border-bottom: 2px solid #fca5a5 !important; padding-bottom: 16px; margin-bottom: 8px; }
            .table tbody td:last-child { border-bottom: none !important; padding-bottom: 0; padding-top: 16px; display: block; }
            .table tbody td:last-child::before { display: none; } 
            .table tbody td:last-child .btn { padding: 12px !important; font-size: 1.05rem; }
        }
    </style>
</head>
<body>

<div class="confirm-card">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold text-dark mb-0">🔍 Step 5 | ตรวจรับคืน</h4>
        <a href="step5-list.html" class="btn btn-outline-danger px-3 fw-bold rounded-pill btn-sm border-2">🔙 กลับ</a>
    </div>
    
    <div class="info-box">
        <div class="text-center">
            <div class="info-label">🔖 เลขรายการ</div>
            <div id="displayReqIdBox" class="info-value">กำลังโหลด...</div>
        </div>
        <div class="divider"></div>
        <div class="text-center">
            <div class="info-label">👤 ผู้ขอเบิกยืม</div>
            <div id="displayUserName" class="info-value">กำลังโหลด...</div>
        </div>
        <div class="divider"></div>
        <div class="text-center">
            <div class="info-label">👨‍💻 แอดมินผู้เตรียม</div>
            <div id="displayAdminName" class="info-value">กำลังโหลด...</div>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table align-middle">
            <thead>
                <tr>
                    <th class="text-start ps-4">เครื่องที่</th>
                    <th>เช็ค G-Drive</th>
                    <th>เช็คแอพ File</th>
                    <th>เช็คแอพ รูปภาพ</th>
                    <th>เช็คแอพ Safari</th>
                    <th>ปุ่มลัด</th>
                </tr>
            </thead>
            <tbody id="itemList">
                <tr><td colspan="6" class="text-muted py-4 text-center">กำลังโหลดข้อมูลเครื่อง... ⏳</td></tr>
            </tbody>
        </table>
    </div>

    <button class="btn btn-confirm shadow-sm" onclick="submitCheck()">ยืนยันการตรวจสอบเครื่องเสร็จสมบูรณ์</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script src="script.js"></script>
<script>
    
    const reqId = new URLSearchParams(window.location.search).get('reqId');

    window.onload = function() {
        if(!reqId) { Swal.fire("แจ้งเตือน","ไม่พบเลขรายการ","warning"); return; }
        document.getElementById('displayReqIdBox').innerText = reqId;

        fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getStep1Data", reqId: reqId }) })
        .then(res => res.json())
        .then(res => {
            document.getElementById('displayUserName').innerText = res.userName || "ไม่ระบุ";
            document.getElementById('displayAdminName').innerText = res.adminName || "ไม่ระบุ";

            const tbody = document.getElementById('itemList');
            tbody.innerHTML = "";
            
            if(res.data && res.data.length > 0) {
                res.data.forEach((item) => {
                    // 📌 แก้ไขตรงนี้: เปลี่ยนจาก fs-5 เป็น fs-6 เพื่อให้ตัวอักษรเท่ากับ Step 2,3,4
                    tbody.innerHTML += `<tr data-ipad="${item.ipadId}">
                        <td data-label="เครื่องที่" class="text-start ps-4">
                            <div class="fw-bold text-dark fs-6 m-0">${item.ipadId}</div>
                        </td>
                        <td data-label="เช็ค G-Drive"><input type="checkbox" class="check-item form-check-input"></td>
                        <td data-label="เช็คแอพ File"><input type="checkbox" class="check-item form-check-input"></td>
                        <td data-label="เช็คแอพ รูปภาพ"><input type="checkbox" class="check-item form-check-input"></td>
                        <td data-label="เช็คแอพ Safari"><input type="checkbox" class="check-item form-check-input"></td>
                        <td data-label="ปุ่มลัด"><button type="button" class="btn btn-shortcut btn-sm fw-bold px-3 rounded-pill w-100" onclick="checkAllInRow(this)">ติ๊กครบ</button></td>
                    </tr>`;
                });
            } else { tbody.innerHTML = '<tr><td colspan="6" class="text-danger fw-bold py-4 text-center">❌ ไม่พบรายการเครื่อง</td></tr>'; }
        });
    };

    function checkAllInRow(btn) {
        const row = btn.closest('tr');
        row.querySelectorAll('.check-item').forEach(cb => cb.checked = true);
    }

    async function submitCheck() {
        const btn = document.querySelector('.btn-confirm');
        const originalText = btn.innerText; btn.innerText = "⏳ กำลังบันทึกข้อมูล..."; btn.disabled = true;

        let items = [];
        document.querySelectorAll('#itemList tr[data-ipad]').forEach(row => {
            const checks = Array.from(row.querySelectorAll('.check-item')).map(c => c.checked ? "☑" : "☐");
            items.push({ ipadId: row.dataset.ipad, checks: checks });
        });
        
        const borrowerName = document.getElementById('displayUserName').innerText;

        try {
            await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "saveStep5", reqId: reqId, items: items, name: localStorage.getItem("userName") || "Admin", borrowerName: borrowerName }) });
            
            Swal.fire({
                title: "ตรวจสอบเสร็จสิ้น!",
                html: `หมายเลขรายการ: <b>${reqId}</b><br>บันทึกผลการตรวจสอบ ${items.length} เครื่องลงระบบเรียบร้อยแล้ว`,
                icon: "success",
                confirmButtonColor: "#dc3545",
                confirmButtonText: "OK",
                allowOutsideClick: false
            }).then(() => {
                window.location.href = "admin.html";
            });

        } catch (error) {
            Swal.fire("❌ เกิดข้อผิดพลาด", "ในการบันทึก กรุณาลองใหม่", "error"); btn.innerText = originalText; btn.disabled = false;
        }
    }
</script>
</body>
</html>
