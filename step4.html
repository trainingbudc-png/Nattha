<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 4 | ส่งคืนเครื่อง</title>
	<link rel="icon" href="https://github.com/trainingbudc-png/Nattha/blob/main/%E0%B8%A3%E0%B8%B9%E0%B8%9B.png?raw=true" type="image/png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme-user.css">
    
    <style>
		/* 🚨 เติม !important บังคับสีดำสนิท 100% */
        .btn-confirm { 
            background-color: #000000 !important; 
            color: #ffffff !important; 
            border-radius: 12px; 
            padding: 15px; 
            font-weight: bold; 
            width: 100%; 
            font-size: 1.1rem; 
            transition: 0.3s; 
            border: none; 
            margin-top: 20px; 
        }
        .btn-confirm:hover { 
            background-color: #1a1a1a !important; 
            color: #ffffff !important; 
            transform: translateY(-2px); 
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); 
        }
        /* 🚨 บังคับเปลี่ยนสีกล่องติ๊กของ Bootstrap เป็นสีดำ/เทาเข้ม (สีเดียวกับปุ่ม) */
        .form-check-input:checked {
            background-color: #6c757d !important; 
            border-color: #6c757d !important;
        }
		body { background: #f8f9fa; font-family: 'Kanit', sans-serif; padding: 20px; }
        .confirm-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); max-width: 900px; margin: auto; border: 1px solid #e9ecef; }
        .info-box { background-color: #f8f9fa; border: 1px solid #dee2e6; border-radius: 12px; padding: 15px 10px; margin-bottom: 25px; display: flex; justify-content: space-around; align-items: stretch; }
        .info-label { font-size: 0.85rem; color: #6c757d; font-weight: 600; text-transform: uppercase; margin-bottom: 4px; }
        .info-value { font-size: 1.05rem; font-weight: bold; color: #212529; word-break: break-word;}
        .divider { width: 1px; background-color: #dee2e6; }
        
        .ipad-card { transition: all 0.3s ease; border-color: #dee2e6; }
        .ipad-card.active-card { border-color: #212529 !important; box-shadow: 0 4px 15px rgba(0,0,0,0.08) !important; transform: translateY(-2px); }
        .select-ipad { width: 26px !important; height: 26px !important; cursor: pointer; accent-color: #212529; transition: transform 0.2s; }
        .select-ipad:active { transform: scale(0.9); }
        .check-item { width: 22px !important; height: 22px !important; cursor: pointer; accent-color: #212529; }

        .btn-ticked-all {
            background-color: #212529 !important;
            color: white !important;
        }

        @media screen and (max-width: 768px) {
            .confirm-card { padding: 20px; }
            .info-box { flex-direction: column; gap: 15px; }
            .divider { width: 100%; height: 1px; }
        }
    </style>
</head>
<body>

<div class="confirm-card">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold text-dark mb-0">📥 Step 4 | ส่งคืนเครื่อง</h4>
        <a href="step4-list.html" class="btn btn-outline-dark px-3 fw-bold rounded-pill btn-sm border-2">🔙 กลับ</a>
    </div>
    
    <div class="info-box">
        <div class="text-center w-50">
            <div class="info-label">👤 ผู้ขอเบิกยืม</div>
            <div id="displayUserName" class="info-value">กำลังโหลด...</div>
            
            <div id="proxyAlert" class="mt-2" style="display: none;">
                <span class="badge bg-warning text-dark border border-warning shadow-sm" style="font-size: 0.8rem; padding: 5px 10px;">
                    🤝 คืนแทนโดย: <span id="proxyNameDisplay" class="fw-bold"></span>
                </span>
            </div>
        </div>
        <div class="divider"></div>
        <div class="text-center w-50">
            <div class="info-label">🔖 เลขรายการ</div>
            <div id="displayReqIdBox" class="info-value">กำลังโหลด...</div>
        </div>
    </div>

    <div id="itemList" class="d-flex flex-column gap-3 mb-4">
        <div class="text-center text-muted py-4">กำลังโหลดข้อมูล... ⏳</div>
    </div>

    <button class="btn btn-confirm shadow-sm" onclick="submitReturn()">ยืนยันการส่งคืนเครื่องทั้งหมด</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> 
<script src="script.js"></script>
<script>
    let reqId = new URLSearchParams(window.location.search).get('reqId');
    let currentLoggerName = "ผู้ใช้งาน";
    let isAdmin = false;
    let globalOwnerName = ""; 

    async function initSystem() {
        const userId = localStorage.getItem("userId");
        if (!userId) {
            localStorage.setItem("pendingUrl", window.location.href);
            window.location.replace("index.html");
            return;
        }

        if(!reqId) { Swal.fire("ข้อผิดพลาด", "ไม่พบเลขรายการ", "error"); return; }
        document.getElementById('displayReqIdBox').innerText = reqId;

        try {
            // 🚀 โหลด 2 API พร้อมกันผ่าน callAPI() ป้องกันโดนบล็อก CORS
            const [syncData, res] = await Promise.all([
                callAPI({ action: "checkRole", userId: userId }).catch(() => ({ success: false })),
                callAPI({ action: "getStep2Data", reqId: reqId })
            ]);

            if (syncData.success && syncData.name) {
                localStorage.setItem("userName", syncData.name);
                localStorage.setItem("userRole", syncData.role);
            }

            currentLoggerName = localStorage.getItem("userName") || "ผู้ใช้งาน";
            isAdmin = localStorage.getItem("userRole") === "Admin";

            if (res.reqStatus && res.reqStatus !== "Step[3]") {
                Swal.fire("แจ้งเตือน", `รายการนี้ส่งคืนเครื่องไปแล้ว (สถานะ: ${res.reqStatus})`, "warning").then(() => {
                    window.location.href = isAdmin ? "admin.html" : "user.html";
                });
                return;
            }

            let originalBorrower = res.userName || "ไม่ระบุ";
            document.getElementById('displayUserName').innerText = originalBorrower;

            globalOwnerName = originalBorrower;
            const currentLoggerId = userId;

            if (res.ownerId && currentLoggerId && res.ownerId !== currentLoggerId) {
                document.getElementById('proxyAlert').style.display = "block";
                document.getElementById('proxyNameDisplay').innerText = currentLoggerName;
            } 

            const container = document.getElementById('itemList');
            container.innerHTML = "";
            
            if(res.data && res.data.length > 0) {
                res.data.forEach((item) => {
                    let adminBtn = isAdmin ? `<button type="button" class="btn btn-dark btn-sm fw-bold px-3 rounded-pill shadow-sm" onclick="tickAllInCard(this)">ติ๊กครบ</button>` : '';
                    container.innerHTML += `
                    <div class="ipad-card bg-white border border-2 rounded-4 overflow-hidden transition-all" data-ipad="${item.ipadId}">
                        <div class="bg-light border-bottom px-4 py-3 d-flex justify-content-between align-items-center">
                            <div class="d-flex align-items-center gap-3">
                                <input type="checkbox" class="select-ipad form-check-input m-0 shadow-sm" id="btn-${item.ipadId}" data-target="collapse-${item.ipadId}" onchange="toggleCard(this)">
                                <label for="btn-${item.ipadId}" style="cursor:pointer;" class="text-dark fw-bold fs-5 mb-0">${item.ipadId}</label>
                            </div>
                            ${adminBtn}
                        </div>
                        <div class="collapse" id="collapse-${item.ipadId}">
                            <div class="p-4 row row-cols-2 row-cols-md-4 g-3 text-center">
                                <div class="col">
                                    <label class="d-flex flex-column align-items-center gap-2 mb-0 w-100" style="cursor: pointer;">
                                        <span class="fw-bold text-dark" style="font-size: 0.9rem; min-height: 25px;">File</span>
                                        <input type="checkbox" class="check-item form-check-input m-0 shadow-sm flex-shrink-0">
                                    </label>
                                </div>
                                <div class="col">
                                    <label class="d-flex flex-column align-items-center gap-2 mb-0 w-100" style="cursor: pointer;">
                                        <span class="fw-bold text-dark" style="font-size: 0.9rem; min-height: 25px;">รูปภาพ</span>
                                        <input type="checkbox" class="check-item form-check-input m-0 shadow-sm flex-shrink-0">
                                    </label>
                                </div>
                                <div class="col">
                                    <label class="d-flex flex-column align-items-center gap-2 mb-0 w-100" style="cursor: pointer;">
                                        <span class="fw-bold text-dark" style="font-size: 0.9rem; min-height: 25px;">Safari</span>
                                        <input type="checkbox" class="check-item form-check-input m-0 shadow-sm flex-shrink-0">
                                    </label>
                                </div>
                                <div class="col">
                                    <label class="d-flex flex-column align-items-center gap-2 mb-0 w-100" style="cursor: pointer;">
                                        <span class="fw-bold text-dark" style="font-size: 0.9rem; min-height: 25px;">Wi-Fi</span>
                                        <input type="checkbox" class="check-item form-check-input m-0 shadow-sm flex-shrink-0">
                                    </label>
                                </div>
                                <div class="col">
                                    <label class="d-flex flex-column align-items-center gap-2 mb-0 w-100" style="cursor: pointer;">
                                        <span class="fw-bold text-dark" style="font-size: 0.9rem; min-height: 25px;">Bluetooth</span>
                                        <input type="checkbox" class="check-item form-check-input m-0 shadow-sm flex-shrink-0">
                                    </label>
                                </div>
                                <div class="col">
                                    <label class="d-flex flex-column align-items-center gap-2 mb-0 w-100" style="cursor: pointer;">
                                        <span class="fw-bold text-dark" style="font-size: 0.9rem; min-height: 25px;">AirDrop</span>
                                        <input type="checkbox" class="check-item form-check-input m-0 shadow-sm flex-shrink-0">
                                    </label>
                                </div>
                                <div class="col">
                                    <label class="d-flex flex-column align-items-center gap-2 mb-0 w-100" style="cursor: pointer;">
                                        <span class="fw-bold text-dark" style="font-size: 0.9rem; min-height: 25px;">G-Drive</span>
                                        <input type="checkbox" class="check-item form-check-input m-0 shadow-sm flex-shrink-0">
                                    </label>
                                </div>
                                <div class="col">
                                    <label class="d-flex flex-column align-items-center gap-2 mb-0 w-100" style="cursor: pointer;">
                                        <span class="fw-bold text-dark" style="font-size: 0.9rem; min-height: 25px;">ลบ WI-FI</span>
                                        <input type="checkbox" class="check-item form-check-input m-0 shadow-sm flex-shrink-0">
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>`;
                });
            } else { 
                container.innerHTML = `<div class="text-danger py-4 text-center">❌ ไม่พบรายการเครื่อง</div>`; 
            }
        } catch (err) {
            document.getElementById('itemList').innerHTML = `
                <div class="text-danger py-4 text-center fw-bold">
                    ❌ ไม่สามารถเชื่อมต่อฐานข้อมูลได้<br>
                    <span class="text-muted fw-normal" style="font-size: 0.85rem;">โปรดตรวจสอบลิงก์ API_URL หรือการ Deploy สคริปต์ใหม่</span><br>
                    <span class="text-muted fw-normal" style="font-size: 0.75rem;">(${err.message})</span>
                </div>
            `;
            console.error("Fetch Data Error:", err);
        }
    }

    initSystem();

    function toggleCard(checkbox) {
        const targetId = checkbox.dataset.target;
        const collapseElement = document.getElementById(targetId);
        const bsCollapse = bootstrap.Collapse.getOrCreateInstance(collapseElement, { toggle: false });
        const card = checkbox.closest('.ipad-card');
        
        if (checkbox.checked) {
            bsCollapse.show();
            card.classList.add('active-card');
        } else {
            bsCollapse.hide();
            card.classList.remove('active-card');
            collapseElement.querySelectorAll('.check-item').forEach(cb => cb.checked = false); 
        }
    }

    function tickAllInCard(btn) {
        const card = btn.closest('.ipad-card');
        const mainCheck = card.querySelector('.select-ipad');
        if (!mainCheck.checked) {
            mainCheck.checked = true;
            toggleCard(mainCheck);
        }
        card.querySelectorAll('.check-item').forEach(cb => { cb.checked = true; });

        btn.classList.add('btn-ticked-all');

        card.querySelectorAll('.check-item').forEach(cb => {
            cb.addEventListener('change', function() {
                if(!this.checked) {
                    btn.classList.remove('btn-ticked-all');
                }
            }, { once: true });
        });
    }

    async function submitReturn() {
        let items = [];
        let isAllChecked = true; 

        document.querySelectorAll('.select-ipad:checked').forEach(checkbox => {
            const card = checkbox.closest('.ipad-card');
            const checks = Array.from(card.querySelectorAll('.check-item'));

            if (checks.some(c => !c.checked)) isAllChecked = false;
            const checkValues = checks.map(c => c.checked ? "☑" : "☐");
            items.push({ ipadId: card.dataset.ipad, checks: checkValues });
        });

        if(items.length === 0) {
            Swal.fire({ title: "⚠️ ข้อมูลไม่ครบถ้วน", text: "กรุณาติ๊กเลือกหน้าชื่ออุปกรณ์ที่ต้องการส่งคืน อย่างน้อย 1 รายการครับ!", icon: "warning", confirmButtonColor: "#212529" });
            return;
        }

        if (!isAllChecked) {
            Swal.fire({ title: "⚠️ ข้อมูลไม่ครบถ้วน", text: "กรุณาตรวจสอบและติ๊กรายการให้ครบทุกข้อ สำหรับ iPad ที่เลือกครับ!", icon: "warning", confirmButtonColor: "#212529" });
            return;
        }

        const btn = document.querySelector('.btn-confirm');
        const originalText = btn.innerText; 
        btn.innerText = "⏳ กำลังบันทึก..."; 
        btn.disabled = true;

       try {
            // 🚀 เรียกผ่าน callAPI แทน
            const result = await callAPI({ 
                action: "saveStep4", 
                reqId: reqId, 
                items: items, 
                actorName: currentLoggerName,
                ownerName: globalOwnerName,
                userId: localStorage.getItem("userId") 
            });
            
            if(result.status === "success") {
                let nextPage = isAdmin ? "admin.html" : "user.html";
                showNavyAlert("ส่งคืนสำเร็จ!", `หมายเลขรายการ: <b>${reqId}</b><br>ส่งคืนอุปกรณ์จำนวน ${items.length} เครื่องเรียบร้อยแล้ว`, "success", nextPage);
            } else { 
                Swal.fire("❌ เกิดข้อผิดพลาด", result.message, "error"); 
                btn.innerText = originalText; btn.disabled = false; 
            }
        } catch (error) {
            Swal.fire("❌ เกิดข้อผิดพลาด", "ไม่สามารถเชื่อมต่อระบบได้", "error"); 
            btn.innerText = originalText; btn.disabled = false;
        }
    }
</script>
</body>
</html>
